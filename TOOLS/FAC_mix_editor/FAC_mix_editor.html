<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F.A.C. V2 Mix &amp; Function Editor</title>
<style>
/* ============================================================================
   F.A.C. V2 GRAPHICAL MIX / SPECIAL FUNCTION EDITOR
   Single self contained file. No build step, no CDN, no network. Offline forever.
   ========================================================================== */
:root{
	--bg:#121212; --panel:#1e1e1e; --panel2:#252525; --line:#333; --line2:#444;
	--accent:#00adb5; --accent-dim:#00787d; --text:#e6e6e6; --muted:#8b8b8b;
	--err:#f4564a; --warn:#e8a33d; --ok:#4caf50; --wire:#5a5a5a;
	--pos:#4fc3f7; --neg:#ff8a65;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
	margin:0; background:var(--bg); color:var(--text); overflow:hidden;
	font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; font-size:13px;
	display:flex; flex-direction:column;
}
button,select,input,textarea{font-family:inherit; font-size:12px; color:var(--text)}
button{background:#2c2c2c;border:1px solid var(--line2);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{background:#383838;border-color:var(--accent)}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent-dim);border-color:var(--accent);font-weight:600}
button.primary:hover{background:var(--accent)}
button.tiny{padding:2px 6px;font-size:11px}
button.on{background:var(--accent-dim);border-color:var(--accent)}
select,input[type=text],input[type=number]{background:#161616;border:1px solid var(--line2);border-radius:5px;padding:3px 6px}
input[type=number]{width:84px}
input[type=range]{accent-color:var(--accent)}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent)}
a{color:var(--accent)}
.mono{font-family:Consolas,'Courier New',monospace}
.muted{color:var(--muted)}
.hidden{display:none !important}

/* ---- top bar ---- */
#topbar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
#brand{font-weight:800;color:var(--accent);letter-spacing:1px;white-space:nowrap}
#brand small{display:block;font-weight:400;color:var(--muted);letter-spacing:0;font-size:10px}
.sep{width:1px;height:24px;background:var(--line2);margin:0 2px}
#topbar label{color:var(--muted);font-size:11px}

/* ---- self test banner ---- */
#stBanner{padding:6px 12px;font-weight:700;text-align:center;flex:0 0 auto}
#stBanner.bad{background:var(--err);color:#fff}
#stBanner.good{background:#1c3a1e;color:#9ede9f;font-weight:500;font-size:11px}

/* ---- main split ---- */
#main{flex:1 1 auto;display:flex;min-height:0}
aside{background:var(--panel);display:flex;flex-direction:column;min-height:0}
#palette{width:196px;border-right:1px solid var(--line);flex:0 0 auto}
#right{width:300px;border-left:1px solid var(--line);flex:0 0 auto}

/* ---- resize splitters ---- */
.vsplit{width:5px;flex:0 0 auto;cursor:col-resize;background:var(--panel2);position:relative;z-index:5}
.vsplit:hover,.vsplit.drag{background:var(--accent)}
.hsplit{height:5px;flex:0 0 auto;cursor:row-resize;background:var(--panel2);position:relative;z-index:5}
.hsplit:hover,.hsplit.drag{background:var(--accent)}
body.resizing-v,body.resizing-v *{cursor:col-resize !important;user-select:none !important}
body.resizing-h,body.resizing-h *{cursor:row-resize !important;user-select:none !important}
.paneHead{padding:5px 8px;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);
	background:var(--panel2);border-bottom:1px solid var(--line);text-transform:uppercase;flex:0 0 auto;
	display:flex;justify-content:space-between;align-items:center}
.paneBody{overflow:auto;flex:1 1 auto;min-height:0}
.catHead{padding:4px 8px;background:#202020;border-bottom:1px solid #2a2a2a;cursor:pointer;font-size:11px;
	font-weight:700;color:var(--accent);display:flex;justify-content:space-between}
.blk{padding:3px 8px 3px 14px;cursor:grab;border-bottom:1px solid #232323;display:flex;justify-content:space-between;gap:4px}
.blk:hover{background:#2b2b2b}
.blk .bd{color:var(--muted);font-size:10px;white-space:nowrap}
#palSearch{margin:5px 6px;width:calc(100% - 12px)}

/* ---- editor ---- */
#editor{flex:1 1 auto;position:relative;overflow:hidden;background:#0e0e0e;min-width:0}
#viewport{position:absolute;inset:0;overflow:hidden;cursor:default}
#world{position:absolute;left:0;top:0;transform-origin:0 0;width:0;height:0}
#wires{position:absolute;left:0;top:0;width:1px;height:1px;pointer-events:none;overflow:visible}
#wires path{fill:none;stroke:var(--wire);stroke-width:2}
#wires path.sel{stroke:var(--accent)}
#wires path.hit{stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}
#wires text{fill:#bdbdbd;font:10px Consolas,monospace;paint-order:stroke;stroke:#0e0e0e;stroke-width:3px}
.node{position:absolute;background:var(--panel);border:1px solid var(--line2);border-radius:7px;
	min-width:118px;user-select:none;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 2px 10px rgba(0,0,0,.6)}
.node.err{border-color:var(--err)}
.node.warn{border-color:var(--warn)}
.node .nh{height:20px;line-height:14px;padding:3px 8px;font-size:11px;font-weight:700;border-radius:6px 6px 0 0;cursor:move;
	white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .nb{padding:2px 0 4px 0;font-size:10px}
.node .val{padding:1px 8px 2px;font:11px Consolas,monospace;text-align:right;color:var(--pos)}
.node .val.n{color:var(--neg)}
.node .sub{padding:0 8px 2px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden}
.port{position:absolute;width:11px;height:11px;border-radius:50%;background:#3a3a3a;border:2px solid #666;cursor:crosshair}
.port:hover,.port.hot{background:var(--accent);border-color:#fff}
.port.i{left:-7px;top:2px}
.port.o{right:-7px;top:24px}
.prow{position:relative;height:15px;padding:0 12px;color:#bbb;font-size:10px;line-height:15px}
.cat-source .nh{background:#264a4d;color:#a5e9ec}
.cat-g1 .nh{background:#2b3a52;color:#b8cdf0}
.cat-g2 .nh{background:#3d3055;color:#d5c2f0}
.cat-g3 .nh{background:#503146;color:#f0c2df}
.cat-g4 .nh{background:#3f4126;color:#e4e9a8}
.cat-state .nh{background:#523a24;color:#f2cfa8}
.cat-sink .nh{background:#4a2626;color:#f0b3b3}
.cat-group .nh{background:#3a3a3a;color:#ddd;cursor:pointer}
.node.grouped{border-left:3px solid var(--accent)}
#groups{position:absolute;left:8px;top:8px;display:flex;gap:5px;flex-wrap:wrap;max-width:70%;pointer-events:none}
#groups .chip{cursor:pointer;user-select:none;pointer-events:auto}
#groups .chip:not(.on){background:#1e1e1e}
#hud{position:absolute;left:8px;bottom:8px;background:rgba(20,20,20,.9);border:1px solid var(--line2);
	border-radius:7px;padding:6px 10px;font:11px Consolas,monospace;pointer-events:none;line-height:1.5}
#hud b{color:var(--accent)}
#selbox{position:absolute;border:1px dashed var(--accent);background:rgba(0,173,181,.12);pointer-events:none}
#editHint{position:absolute;right:8px;top:8px;font-size:10px;color:#555;pointer-events:none;text-align:right;line-height:1.5}

/* ---- right pane ---- */
.field{display:flex;align-items:center;gap:6px;padding:3px 8px}
.field label{flex:0 0 96px;color:var(--muted);font-size:11px;text-align:right}
.field input[type=text]{flex:1 1 auto;min-width:0}
.field select{flex:1 1 auto;min-width:0}
.help{padding:5px 9px;color:#9a9a9a;font-size:11px;line-height:1.45;border-bottom:1px solid var(--line);background:#1a1a1a}
.vitem{padding:4px 8px;border-bottom:1px solid #262626;cursor:pointer;font-size:11px;line-height:1.35}
.vitem:hover{background:#2a2a2a}
.vitem b{display:inline-block;min-width:52px}
.vitem.e b{color:var(--err)} .vitem.w b{color:var(--warn)}
#costBox{padding:6px 9px;font:11px Consolas,monospace;line-height:1.6;border-top:1px solid var(--line);background:#1a1a1a;flex:0 0 auto}
#costBox b{color:var(--accent)}

/* ---- bottom ---- */
#bottom{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;height:262px;min-height:26px}
#tabs{display:flex;gap:0;background:var(--panel2);border-bottom:1px solid var(--line);flex:0 0 auto;align-items:center}
.tab{padding:5px 12px;cursor:pointer;font-size:11px;font-weight:600;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap}
.tab.on{color:var(--accent);background:var(--panel);box-shadow:inset 0 -2px 0 var(--accent)}
.tabPanel{flex:1 1 auto;overflow:auto;min-height:0;padding:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.card{background:#1a1a1a;border:1px solid var(--line);border-radius:7px;padding:7px 9px}
.card h4{margin:0 0 5px;font-size:11px;color:var(--accent);letter-spacing:.6px;text-transform:uppercase}
table.g{border-collapse:collapse;font-size:11px}
table.g th,table.g td{border:1px solid #2e2e2e;padding:2px 6px;text-align:right}
table.g th{background:#232323;color:var(--muted);font-weight:600}
table.g td.l,table.g th.l{text-align:left}
pre.code{background:#000;color:#cfe9c8;font:11.5px Consolas,'Courier New',monospace;padding:10px;
	border:1px solid var(--line2);border-radius:7px;margin:0;overflow:auto;max-height:100%;white-space:pre;line-height:1.35}
.bar{position:relative;height:12px;background:#181818;border:1px solid #333;border-radius:3px;overflow:hidden;min-width:110px}
.bar i{position:absolute;top:0;bottom:0;left:50%;background:var(--accent)}
.bar u{position:absolute;top:0;bottom:0;left:50%;width:1px;background:#555}
.chstrip{display:grid;grid-template-columns:34px 118px 44px 44px 46px 78px 52px 30px;gap:5px;align-items:center;margin-bottom:3px;font-size:11px}
.chstrip .mono{text-align:right}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:flex;align-items:center;justify-content:center}
#modalBox{background:var(--panel);border:1px solid var(--accent);border-radius:12px;max-width:860px;width:88%;
	max-height:84vh;overflow:auto;padding:18px 22px;line-height:1.55}
#modalBox h3{margin-top:0;color:var(--accent)}
#modalBox h4{color:var(--accent);margin-bottom:4px}
#modalBox code{background:#000;padding:1px 4px;border-radius:3px;font-family:Consolas,monospace}
#modalBox ul{padding-left:20px}
.warnbox{background:#3a2a12;border:1px solid var(--warn);border-radius:6px;padding:6px 9px;color:#f0d5a8;font-size:11px;margin:6px 0}
.errbox{background:#3a1616;border:1px solid var(--err);border-radius:6px;padding:6px 9px;color:#f5bdb8;font-size:11px;margin:6px 0}
.okbox{background:#16301a;border:1px solid var(--ok);border-radius:6px;padding:6px 9px;color:#b6e6bb;font-size:11px;margin:6px 0}
canvas{display:block;background:#0b0b0b;border:1px solid var(--line2);border-radius:7px}
.chip{display:inline-block;background:#2a2a2a;border:1px solid var(--line2);border-radius:10px;padding:1px 8px;font-size:10px;color:#bbb}
.chip.on{background:var(--accent-dim);border-color:var(--accent);color:#fff}
</style>
</head>
<body>

<div id="topbar">
	<div id="brand">F.A.C. MIX EDITOR<small>V2 &mdash; graph &rarr; simulate &rarr; C</small></div>
	<div class="sep"></div>
	<label>Mode</label>
	<select id="uiMode"><option value="mix">Mix (8 in / 10 out)</option><option value="function">Special function (1/1)</option></select>
	<label>Title</label><input type="text" id="uiTitle" value="my mix" style="width:130px">
	<label>Author</label><input type="text" id="uiAuthor" value="" placeholder="F.A.C. mix editor" style="width:110px">
	<label id="lblInst" class="hidden">Instances</label>
	<input type="number" id="uiInstances" class="hidden" min="1" max="9" value="1" style="width:48px">
	<div class="sep"></div>
	<button id="btNew">New</button>
	<button id="btOpen">Open</button>
	<button id="btSave">Save</button>
	<select id="uiPreset"><option value="">Load preset&hellip;</option></select>
	<div class="sep"></div>
	<button id="btUndo" title="Ctrl+Z">Undo</button>
	<button id="btRedo" title="Ctrl+Y">Redo</button>
	<button id="btFrame" title="Frame all (F)">Frame</button>
	<div class="sep"></div>
	<button class="primary" id="btExport">Export &amp; register&hellip;</button>
	<button id="btSelfTest">Self-test</button>
	<button id="btHelp">?</button>
	<input type="file" id="fileIn" class="hidden" accept=".json,.facmix.json,.c">
</div>

<div id="stBanner" class="good">self-test not run yet</div>

<div id="main">
	<aside id="palette">
		<div class="paneHead">Blocks</div>
		<input type="text" id="palSearch" placeholder="filter&hellip;">
		<div class="paneBody" id="palBody"></div>
	</aside>

	<div class="vsplit" id="splitPalette" title="drag to resize"></div>

	<section id="editor">
		<div id="viewport">
			<div id="world">
				<svg id="wires"></svg>
				<div id="nodes"></div>
			</div>
		</div>
		<div id="groups"></div>
		<div id="editHint">drag from a palette block &middot; drag port&rarr;port to wire<br>del = delete &middot; ctrl+C/V &middot; wheel = zoom &middot; space/middle drag = pan</div>
		<div id="hud"></div>
	</section>

	<div class="vsplit" id="splitRight" title="drag to resize"></div>

	<aside id="right">
		<div class="paneHead">Inspector</div>
		<div class="paneBody" id="inspBody" style="flex:0 0 auto;height:46%"></div>
		<div class="hsplit" id="splitInsp" title="drag to resize"></div>
		<div class="paneHead">Validation <span id="vCount"></span></div>
		<div class="paneBody" id="valBody"></div>
		<div id="costBox"></div>
	</aside>
</div>

<div class="hsplit" id="splitBottom" title="drag to resize"></div>

<div id="bottom">
	<div id="tabs">
		<div class="tab on" data-p="sim">Sim &amp; sticks</div>
		<div class="tab" data-p="scope">Scope</div>
		<div class="tab" data-p="robot">Robot</div>
		<div class="tab" data-p="sensors">Sensors</div>
		<div class="tab" data-p="pad">Gamepad</div>
		<div class="tab" data-p="code">Generated code</div>
		<div class="tab" data-p="reg">Registration</div>
		<div class="tab" data-p="test">Self-test</div>
		<div style="flex:1 1 auto"></div>
		<button class="tiny" id="btBottomToggle" style="margin-right:6px">&#9660;</button>
	</div>
	<div class="tabPanel" id="p-sim"></div>
	<div class="tabPanel hidden" id="p-scope"></div>
	<div class="tabPanel hidden" id="p-robot"></div>
	<div class="tabPanel hidden" id="p-sensors"></div>
	<div class="tabPanel hidden" id="p-pad"></div>
	<div class="tabPanel hidden" id="p-code"></div>
	<div class="tabPanel hidden" id="p-reg"></div>
	<div class="tabPanel hidden" id="p-test"></div>
</div>

<div id="modal" class="hidden"><div id="modalBox"></div></div>

<script>
"use strict";
/* ==========================================================================
 * SECTION: FAC_MATH
 * A line by line port of Core/Inc/FAC_Code/mixes_functions/fac_math.h.
 * This is the ONLY copy of the math in this tool: the simulator calls it and
 * the code generator emits the C calls that map onto it, one to one.
 *
 * Exactness rules (fac_math.h header comment):
 *   - integer division TRUNCATES TOWARD ZERO  -> idiv(), never Math.floor
 *   - group 1 clamps arguments AND result, in the order the C does
 *   - group 2 does not clamp anything, so every product is range checked
 * ========================================================================== */
const V_MAX = 1000, V_MIN = -1000, V_ZERO = 0;
const ANGLE_TURN = 4096, ANGLE_MASK = 4095, ANGLE_HALF = 2048, ANGLE_QUARTER = 1024;
const MATH_FINE = 10000;                       /* FAC_MATH_FINE = FAC_VALUE_MAX * 10 */
const I32_MIN = -2147483648, I32_MAX = 2147483647;
const RECEIVER_CHANNEL_RESOLUTION = 1000;      /* config.h */
const RECEIVER_CHANNELS_NUMBER = 8;            /* config.h */
/* the device end of the chain, so the Robot tab can mirror fac_mapper.c exactly
 * instead of inventing its own scaling */
const MOTOR_SPEED_RESOLUTION = 1000;           /* config.h - equals the receiver resolution */
const MAX_SERVO_VALUE = 999;                   /* fac_servo.h - (RECEIVER_CHANNEL_RESOLUTION-1),
                                                * the divisor of the pulse formula, fac_servo.c:98 */
const MIXES_MAX_INPUTS_NUMBER = 8;             /* fac_mixes.h */
const MIXES_MAX_OUTPUTS_NUMBER = 10;           /* fac_mixes.h */
const SPECIAL_FUNCITONS_NUMBER = 20;           /* fac_functions.h - spelling is API, do not fix */

/* the one division helper. C truncates toward zero: -7/2 is -3, not -4 */
function idiv(a, b) { return Math.trunc(a / b); }

/* an int32_t overflow in C is undefined behaviour, so it is an error here and
 * never a silent wrap. Thrown during simulation, caught and shown on the node. */
class FacOverflow extends Error {
	constructor(what, value) {
		super(what + ' overflows int32_t (' + value + ')');
		this.what = what; this.value = String(value);
	}
}
function chk32(v, what) {
	if (v < I32_MIN || v > I32_MAX) throw new FacOverflow(what || 'intermediate', v);
	return v;
}
/* group 2 products can pass 2^53 where a double stops being exact, so the
 * product itself is formed with BigInt and only then range checked */
function mulChecked(a, b, what) {
	const p = BigInt(a) * BigInt(b);
	if (p < -2147483648n || p > 2147483647n) throw new FacOverflow(what || 'product', p.toString());
	return Number(p);
}
function fitsI32(v) { return v >= I32_MIN && v <= I32_MAX; }

/* ---------------------------------------------------------------- group 1 */
function m_clamp(v) { if (v > V_MAX) return V_MAX; if (v < V_MIN) return V_MIN; return v; }
function m_abs(v) { v = m_clamp(v); return v < 0 ? -v : v; }
function m_add(a, b) { return m_clamp(m_clamp(a) + m_clamp(b)); }
function m_sub(a, b) { return m_clamp(m_clamp(a) - m_clamp(b)); }
function m_mul(a, b) { return m_clamp(idiv(m_clamp(a) * m_clamp(b), V_MAX)); }
function m_scale(v, percent) {
	if (percent > 10000) percent = 10000;
	if (percent < -10000) percent = -10000;
	return m_clamp(idiv(m_clamp(v) * percent, 100));
}
function m_min(a, b) { a = m_clamp(a); b = m_clamp(b); return a < b ? a : b; }
function m_max(a, b) { a = m_clamp(a); b = m_clamp(b); return a > b ? a : b; }
function m_blend(a, b, w) {
	if (w <= 0) return m_clamp(a);
	if (w >= V_MAX) return m_clamp(b);
	return m_clamp(idiv(m_clamp(a) * (V_MAX - w) + m_clamp(b) * w, V_MAX));
}
function m_deadzone(v, size) {
	if (size <= 0) return m_clamp(v);
	if (size >= V_MAX) return V_ZERO;
	const magnitude = m_abs(v);
	if (magnitude <= size) return V_ZERO;
	const out = idiv((magnitude - size) * V_MAX, V_MAX - size);
	return v < 0 ? -out : out;
}
function m_expo(v, amount) {
	v = m_clamp(v);
	if (amount <= 0) return v;
	if (amount > V_MAX) amount = V_MAX;             /* clipped, not rejected */
	const cube = idiv(idiv(v * v, V_MAX) * v, V_MAX);
	return m_clamp(idiv(v * (V_MAX - amount) + cube * amount, V_MAX));
}
function m_to_range(v, outMin, outMax) {
	v = m_clamp(v);
	return chk32(idiv(mulChecked(v - V_MIN, outMax - outMin, 'to_range'), V_MAX - V_MIN) + outMin, 'to_range');
}
function m_from_range(x, inMin, inMax) {
	if (inMax === inMin) return V_ZERO;
	if (x > inMax) x = inMax;
	if (x < inMin) x = inMin;
	return idiv(mulChecked(x - inMin, V_MAX - V_MIN, 'from_range'), inMax - inMin) + V_MIN;
}
/* ---------------------------------------------------------------- group 2 */
function m_mul_scaled(a, b, scale) {
	if (scale === 0) return 0;
	return idiv(mulChecked(a, b, 'mul_scaled a*b'), scale);
}
function m_div_scaled(a, b, scale) {
	if (b === 0) return 0;
	return idiv(mulChecked(a, scale, 'div_scaled a*scale'), b);
}
function m_clamp_to(v, lo, hi) { if (v > hi) return hi; if (v < lo) return lo; return v; }
/* binary restoring square root on UNSIGNED 32 bit: >>> everywhere, never >> */
function m_sqrt(v) {
	if (v <= 0) return 0;
	let rest = v >>> 0;
	let root = 0 >>> 0;
	let bit = (1 << 30) >>> 0;
	while (bit > rest) bit = bit >>> 2;
	while (bit !== 0) {
		if (rest >= ((root + bit) >>> 0)) {
			rest = (rest - (root + bit)) >>> 0;
			root = (((root >>> 1) + bit) >>> 0);
		} else {
			root = root >>> 1;
		}
		bit = bit >>> 2;
	}
	return root | 0;
}
/* ---------------------------------------------------------------- group 3 */
function m_angle_wrap(a) { return a & ANGLE_MASK; }
function m_sin(angle) {
	let t = m_angle_wrap(angle);
	if (t > ANGLE_HALF) t -= ANGLE_TURN;
	t = idiv(t * MATH_FINE, ANGLE_HALF);
	const magnitude = t < 0 ? -t : t;
	let y = idiv(4 * t * (MATH_FINE - magnitude), MATH_FINE);
	const yMagnitude = y < 0 ? -y : y;
	y = y + idiv(225 * (idiv(y * yMagnitude, MATH_FINE) - y), 1000);

	return idiv(idiv(idiv(ANGLE_TURN, 8) * ratio, 100) - idiv(a * c, 1000), 100);

	if (xM === 0 && yM === 0) return 0;
	if (xM >= yM) angle = m_atan_ratio(idiv(mulChecked(yM, MATH_FINE, 'atan2 ratio'), xM));
	else angle = ANGLE_QUARTER - m_atan_ratio(idiv(mulChecked(xM, MATH_FINE, 'atan2 ratio'), yM));

/* ==========================================================================
 * SECTION: RECEIVER
 * Port of the channel chain of Core/Src/FAC_Code/fac_std_receiver.c.
 *
 * FOUR stages, and they must stay apart or a simulator either double applies
 * the deadzone or invents travel the hardware does not have:
 *   0  backend capture           0 .. 1000  fac_pwm_receiver.c:82, fac_ppm_receiver.c:62
 *   1a deadzone                  0 .. 1000  FAC_std_receiver_calculate_dead_zone()
 *   1b store clamp          clamp to 1000   FAC_std_receiver_SET_channel()
 *   2  mix input             -1000 .. +1000 FAC_math_from_range(ch,0,1000)
 *
 * The channel domain is 0 .. RECEIVER_CHANNEL_RESOLUTION INCLUSIVE: 1001 values,
 * so it has an exact centre. rx = 500 gives from_range(500,0,1000) = 0 with no
 * rounding, and the identity mix_input = 2*rx - 1000 holds exactly across the
 * whole chain.
 *
 * HISTORICAL, and the reason the stages are modelled separately at all: the
 * domain used to be inconsistent between producers and consumers. The deadzone
 * and FAC_math_from_range already spoke 0..1000, while the capture and the store
 * clamped to RECEIVER_CHANNEL_RESOLUTION-1 = 999. SET_channel clamped the
 * deadzone result to 999 AFTER the deadzone had snapped the top extreme to 1000,
 * so GET_channel never returned 1000 and a mix input reached -1000 but only
 * +998 - travel was ASYMMETRIC. That was a firmware bug, not a modelling choice,
 * and it has been fixed on the firmware side (see the "receiver/mapper: make the
 * value chain reach full scale at both ends" commit). Stage 1b survives as a
 * guard that is a no-op in practice; collapsing the stages would still be wrong,
 * because 1a and 1b are separate functions with separate domains in the source.
 *
 * The device end, mirrored by the Robot tab from fac_mapper.c:
 *   servo  m_to_range(v, 0, MAX_SERVO_VALUE) -> 0 .. 999   fac_mapper.c:102
 *   motor  abs(v), sign carried as direction -> 0 .. 1000  fac_mapper.c:77
 * ========================================================================== */

/* map_int32() of fac_app.c:386 - clamps x into [in_min,in_max] first */
function map_int32(x, inMin, inMax, outMin, outMax) {
	if (inMax === inMin) return outMin;
	if (x > inMax) x = inMax;
	if (x < inMin) x = inMin;
	return idiv((x - inMin) * (outMax - outMin), inMax - inMin) + outMin;
}

/*
 * FAC_std_receiver_calculate_dead_zone(), fac_std_receiver.c:86-127, verbatim.
 * chNumber is 1 BASED. Channel 3 has no return spring, so it skips the two
 * range conversions and only gets the extremes / bottom band.
 */
function rxDeadzone(value, deadzonePerc, chNumber) {
	let temp = value | 0;
	const maxValue = RECEIVER_CHANNEL_RESOLUTION;
	const minValue = -RECEIVER_CHANNEL_RESOLUTION;
	const deadzoneValue = idiv(idiv(maxValue - minValue, 100), 2) * deadzonePerc;  /* = 10 * perc */
	if (chNumber !== 3)
		temp = map_int32(temp, 0, RECEIVER_CHANNEL_RESOLUTION, -RECEIVER_CHANNEL_RESOLUTION, RECEIVER_CHANNEL_RESOLUTION);

	if (value > maxValue) temp = maxValue;
	if (value < minValue) temp = minValue;   /* dead in C too: value is uint16_t */

	if (temp + (deadzoneValue * 2) >= maxValue) temp = maxValue;
	else if (temp - (deadzoneValue * 2) <= minValue) temp = minValue;
	else if (temp >= -deadzoneValue && temp <= deadzoneValue) temp = 0;
	else if (temp > 0) temp = map_int32(temp, 0 + deadzoneValue, maxValue - (deadzoneValue * 2), 0, maxValue);
	else if (temp < 0) temp = map_int32(temp, minValue + (deadzoneValue * 2), 0 - deadzoneValue, minValue, 0);

	if (chNumber !== 3)
		temp = map_int32(temp, -RECEIVER_CHANNEL_RESOLUTION, RECEIVER_CHANNEL_RESOLUTION, 0, RECEIVER_CHANNEL_RESOLUTION);
	return temp;
}

/* FAC_std_receiver_SET_channel(), fac_std_receiver.c:60-67 - the store clamp.
 * A no-op in practice now that the deadzone's own output is already bounded by
 * RECEIVER_CHANNEL_RESOLUTION, but it is a distinct function in the source with
 * its own domain, so it stays a distinct stage here. */
function rxStoreClamp(v) {
	if (v > RECEIVER_CHANNEL_RESOLUTION) return RECEIVER_CHANNEL_RESOLUTION;
	return v;
}
/* stage 0 -> stage 1: what FAC_std_receiver_GET_channel() will return */
function rxStage1(stage0, deadzonePerc, chNumber) {
	return rxStoreClamp(rxDeadzone(stage0, deadzonePerc, chNumber));

/* stage 1 -> stage 2: what FAC_mixes_update_mix_inputs() / the function
 * framework do. chSetting 0 means the slot is disabled and forced to zero. */
function rxStage2(stage1, reversed) {
	let v = m_from_range(stage1, 0, RECEIVER_CHANNEL_RESOLUTION);
	if (reversed) v = -v;
	return v;
}
/* ==========================================================================
 * SECTION: INTERVALS
 * Every wire carries a proven [lo,hi] interval. That is what turns "this might
 * overflow int32_t" from a runtime surprise into a graph-build-time error, as
 * README_MIX_EDITOR_API rule 9 asks for.
 * ========================================================================== */
const IV = {
	mk: (lo, hi) => ({ lo: lo, hi: hi }),
	pt: (v) => ({ lo: v, hi: v }),
	add: (a, b) => ({ lo: a.lo + b.lo, hi: a.hi + b.hi }),
	sub: (a, b) => ({ lo: a.lo - b.hi, hi: a.hi - b.lo }),
	neg: (a) => ({ lo: -a.hi, hi: -a.lo }),
	abs: (a) => a.lo >= 0 ? { lo: a.lo, hi: a.hi }
		: (a.hi <= 0 ? { lo: -a.hi, hi: -a.lo } : { lo: 0, hi: Math.max(-a.lo, a.hi) }),
	mul: (a, b) => {
		const p = [a.lo * b.lo, a.lo * b.hi, a.hi * b.lo, a.hi * b.hi];
		return { lo: Math.min.apply(null, p), hi: Math.max.apply(null, p) };
	},
	mulK: (a, k) => k >= 0 ? { lo: a.lo * k, hi: a.hi * k } : { lo: a.hi * k, hi: a.lo * k },
	/* truncation toward zero is monotone in the numerator, so endpoints suffice */
	divK: (a, k) => k > 0 ? { lo: idiv(a.lo, k), hi: idiv(a.hi, k) }
		: { lo: idiv(a.hi, k), hi: idiv(a.lo, k) },
	/* a value multiplied by ITSELF is a square and can never be negative - worth
	 * knowing, because the generic interval product cannot see that */
	square: (a) => a.lo >= 0 ? { lo: a.lo * a.lo, hi: a.hi * a.hi }
		: (a.hi <= 0 ? { lo: a.hi * a.hi, hi: a.lo * a.lo } : { lo: 0, hi: Math.max(a.lo * a.lo, a.hi * a.hi) }),
	union: (a, b) => ({ lo: Math.min(a.lo, b.lo), hi: Math.max(a.hi, b.hi) }),
	clampN: (a) => ({ lo: m_clamp(a.lo), hi: m_clamp(a.hi) }),
	clampTo: (a, lo, hi) => ({ lo: m_clamp_to(a.lo, lo, hi), hi: m_clamp_to(a.hi, lo, hi) }),
	mag: (a) => Math.max(Math.abs(a.lo), Math.abs(a.hi)),
	fits: (a) => fitsI32(a.lo) && fitsI32(a.hi),

def({
	id: 'mul_scaled', label: 'mul scaled', cat: 'g2', out: 'RAW', divs: 1,
	ins: [{ n: 'a', k: 'RAW' }, { n: 'b', k: 'RAW' }],
	params: [{ n: 'scale', label: 'scale', t: 'int', min: 0, max: 1000000, def: 1000 }],
	help: 'FAC_math_mul_scaled(a,b,scale) = a*b/scale, NO saturation. 1 div. a*b must fit int32_t, so keep both below ~46000 when similar. scale 0 returns 0.',
	sim: (c, a, p) => m_mul_scaled(a[0], a[1], p.scale),
	emit: (c, a, p) => ({ expr: 'FAC_math_mul_scaled(' + a[0] + ', ' + a[1] + ', ' + p.scale + ')' }),
	range: (r, p, n) => {
		const w0 = n && wireTo(n.id, 0), w1 = n && wireTo(n.id, 1);
		const same = w0 && w1 && w0.from === w1.from;
		const prod = same ? IV.square(r[0]) : IV.mul(r[0], r[1]);
		if (!IV.fits(prod)) return { lo: prod.lo, hi: prod.hi, bad: 'a*b' };
		return p.scale === 0 ? IV.pt(0) : IV.divK(prod, p.scale);
	}
});
def({
	id: 'div_scaled', label: 'div scaled', cat: 'g2', out: 'RAW', divs: 1,
	ins: [{ n: 'a', k: 'RAW' }, { n: 'b', k: 'RAW' }],
	params: [{ n: 'scale', label: 'scale', t: 'int', min: 0, max: 1000000, def: 1000 }],
	help: 'FAC_math_div_scaled(a,b,scale) = a*scale/b, NO saturation. 1 div. a*scale must fit int32_t. b == 0 returns 0 (the primitive guards it).',
	sim: (c, a, p) => m_div_scaled(a[0], a[1], p.scale),
	emit: (c, a, p) => ({ expr: 'FAC_math_div_scaled(' + a[0] + ', ' + a[1] + ', ' + p.scale + ')' }),
	range: (r, p) => {
		const num = IV.mulK(r[0], p.scale);
		if (!IV.fits(num)) return { lo: num.lo, hi: num.hi, bad: 'a*scale' };
		const b = r[1];
		if (b.lo > 0 || b.hi < 0) {
			/* b keeps one sign, so the quotient is monotone in both arguments and
			 * the four corners give the exact bounds */
			const c = [idiv(num.lo, b.lo), idiv(num.lo, b.hi), idiv(num.hi, b.lo), idiv(num.hi, b.hi)];
			return IV.mk(Math.min.apply(null, c), Math.max.apply(null, c));
		}
		const M = IV.mag(num);   /* |trunc(x/b)| <= |x| for |b| >= 1, and b == 0 gives 0 */
		return IV.mk(-M, M);
	}
});

/* ------------------------------------------------------------- STATEFUL
 * Each of these owns file scope statics. They are the only legal way to close a
 * loop in the graph: the state output is read from the PREVIOUS pass, so it is a
 * graph SOURCE and the state input is a graph SINK - which is what breaks a cycle
 * by construction. Every one is correct with its state zero at boot, and every
 * one carries an explicit "on resume after a disarm gap: reset or hold" choice.
 * ------------------------------------------------------------------------- */
def({
	id: 'prev', label: 'previous value', cat: 'state', out: 'RAW', divs: 0, stateful: true, breaks: true,
	ins: [{ n: 'v', k: 'RAW' }],
	params: [{ n: 'onResume', label: 'on resume', t: 'resume', def: '' }],
	help: 'unit delay: gives what the input was on the PREVIOUS pass. 1 static, 0 div. Reads first, assigns last - which is what makes it THE cycle breaker: its output is a graph source and its input a graph sink, so a feedback loop must pass through one of these.',
	sim: (c, a, p, st) => (st.p === undefined ? 0 : st.p),
	simPost: (c, a, p, st) => { st.p = a[0]; },
	emit: (c, a, p, nd) => {
		const S = c.stat(nd, 'prev', 'fac_value_t', 'FAC_VALUE_ZERO');
		c.resetIf(nd, [S + ' = FAC_VALUE_ZERO;']);
		/* the assignment cannot be written now: this block is emitted BEFORE the
		 * node feeding it, precisely because it breaks the cycle. genBody resolves
		 * postFn once every expression is known and appends it at the end. */
		return { expr: S, postFn: (args) => [S + ' = ' + args[0] + ';'] };
	},
	range: (r) => IV.union(r[0], IV.pt(0))
});
def({
	id: 'edge', label: 'edge detect', cat: 'state', out: 'BOOL', divs: 0, stateful: true, multiUse: true,
	ins: [{ n: 'v', k: 'RAW' }],
	params: [{ n: 'th', label: 'threshold', t: 'int', min: -1000000, max: 1000000, def: 500 },
	{ n: 'mode', label: 'mode', t: 'sel', opts: [['rising', 'rising'], ['falling', 'falling'], ['both', 'both']], def: 'rising' },
	{ n: 'onResume', label: 'on resume', t: 'resume', def: '' }],
	help: 'fires for one pass when the input crosses the threshold. 1 static, 0 div.',
	sim: (c, a, p, st) => {
		const prev = st.p === undefined ? 0 : st.p; st.p = a[0];
		const up = prev <= p.th && a[0] > p.th, dn = prev > p.th && a[0] <= p.th;
		return (p.mode === 'rising' ? up : p.mode === 'falling' ? dn : (up || dn)) ? 1 : 0;
	},
	emit: (c, a, p, nd) => {
		const S = c.stat(nd, 'prev', 'fac_value_t', 'FAC_VALUE_ZERO');
		c.resetIf(nd, [S + ' = FAC_VALUE_ZERO;']);
		const up = '(' + S + ' <= ' + p.th + ' && ' + par(a[0]) + ' > ' + p.th + ')';
		const dn = '(' + S + ' > ' + p.th + ' && ' + par(a[0]) + ' <= ' + p.th + ')';
		return { expr: p.mode === 'rising' ? up : p.mode === 'falling' ? dn : up + ' || ' + dn, post: [S + ' = ' + a[0] + ';'] };
	},
	range: () => IV_BOOL
});
def({
	id: 'latch', label: 'toggle latch', cat: 'state', out: 'NORM', divs: 0, stateful: true, multiUse: true,
	ins: [{ n: 'v', k: 'NORM' }],
	params: [{ n: 'on', label: 'switch on above', t: 'int', min: -1000, max: 1000, def: 600 },
	{ n: 'off', label: 're-arm below', t: 'int', min: -1000, max: 1000, def: 400 },
	{ n: 'outm', label: 'output', t: 'sel', opts: [['norm', '+1000 / -1000'], ['bool', '1 / 0']], def: 'norm' },
	{ n: 'onResume', label: 'on resume', t: 'resume', def: '' }],
	help: 'flips every time the input goes above the ON threshold, re-arms below the OFF one. TWO thresholds, never one: a stick sitting on a single edge would chatter at 1 kHz. 2 statics, 0 div.',
	sim: (c, a, p, st) => {
		if (st.l === undefined) { st.l = 0; st.a = 1; }
		if (st.a && a[0] > p.on) { st.l = st.l ? 0 : 1; st.a = 0; }
		if (a[0] < p.off) st.a = 1;
		return p.outm === 'bool' ? st.l : (st.l ? V_MAX : V_MIN);
	},
	emit: (c, a, p, nd) => {
		const L = c.stat(nd, 'latched', 'uint8_t', '0'), A = c.stat(nd, 'armed', 'uint8_t', '1');
		c.resetIf(nd, [L + ' = 0;', A + ' = 1;']);
		return {
			lines: ['if (' + A + ' && ' + par(a[0]) + ' > ' + p.on + ') {', '\t' + L + ' = !' + L + ';', '\t' + A + ' = 0;', '}',
				'if (' + par(a[0]) + ' < ' + p.off + ') {', '\t' + A + ' = 1;', '}'],
			expr: p.outm === 'bool' ? L : (L + ' ? FAC_VALUE_MAX : FAC_VALUE_MIN')
		};
	},
	outKind: (p) => p.outm === 'bool' ? 'BOOL' : 'NORM',
	range: (r, p) => p.outm === 'bool' ? IV_BOOL : IV.mk(V_MIN, V_MAX)
});
def({
	id: 'slew', label: 'slew limiter', cat: 'state', out: 'RAW', divs: 0, stateful: true, multiUse: true,
	ins: [{ n: 'target', k: 'RAW' }],
	params: [{ n: 'step', label: 'step / pass', t: 'int', min: 1, max: 1000000, def: 20 },
	{ n: 'onResume', label: 'on resume', t: 'resume', def: '' }],
	help: 'ramps toward the target by a fixed step every pass, and always reaches it exactly. 1 static, 0 div. The step is PER PASS and the pass rate is only approximately 1 kHz - use the timed ramp when the duration has to be real.',
	sim: (c, a, p, st) => {
		if (st.c === undefined) st.c = 0;
		if (a[0] > st.c + p.step) st.c += p.step;
		else if (a[0] < st.c - p.step) st.c -= p.step;
		else st.c = a[0];
		return st.c;
	},
	emit: (c, a, p, nd) => {
		const S = c.stat(nd, 'cur', 'fac_value_t', 'FAC_VALUE_ZERO');
		c.resetIf(nd, [S + ' = FAC_VALUE_ZERO;']);
		return {
			lines: ['if (' + par(a[0]) + ' > ' + S + ' + ' + p.step + ') {', '\t' + S + ' += ' + p.step + ';',
				'} else if (' + par(a[0]) + ' < ' + S + ' - ' + p.step + ') {', '\t' + S + ' -= ' + p.step + ';',
				'} else {', '\t' + S + ' = ' + a[0] + ';', '}'],
			expr: S
		};
	},
	range: (r, p) => IV.union(r[0], IV.pt(0))
});
def({
	id: 'slew_ms', label: 'slew limiter (timed)', cat: 'state', out: 'RAW', divs: 0, stateful: true, multiUse: true, nowNeeded: true,
	ins: [{ n: 'target', k: 'RAW' }],
	params: [{ n: 'step', label: 'step', t: 'int', min: 1, max: 1000000, def: 10 },
	{ n: 'ms', label: 'every ms', t: 'int', min: 1, max: 10000, def: 10 },
	{ n: 'onResume', label: 'on resume', t: 'resume', def: '' }],
	help: 'the same ramp, but gated on HAL_GetTick() so the duration is a real time and not a pass count. 2 statics, 0 div.',
	sim: (c, a, p, st) => {
		if (st.c === undefined) { st.c = 0; st.t = 0; }
		if (((c.tick - st.t) >>> 0) >= p.ms) {
			st.t = c.tick;
			if (a[0] > st.c + p.step) st.c += p.step;
			else if (a[0] < st.c - p.step) st.c -= p.step;
			else st.c = a[0];
		}
		return st.c;
	},
	emit: (c, a, p, nd) => {
		const S = c.stat(nd, 'cur', 'fac_value_t', 'FAC_VALUE_ZERO'), T = c.stat(nd, 'last', 'uint32_t', '0');
		c.resetIf(nd, [S + ' = FAC_VALUE_ZERO;', T + ' = now;']);
		return {
			lines: ['if ((uint32_t) (now - ' + T + ') >= ' + p.ms + ') {', '\t' + T + ' = now;',
				'\tif (' + par(a[0]) + ' > ' + S + ' + ' + p.step + ') {', '\t\t' + S + ' += ' + p.step + ';',
				'\t} else if (' + par(a[0]) + ' < ' + S + ' - ' + p.step + ') {', '\t\t' + S + ' -= ' + p.step + ';',
				'\t} else {', '\t\t' + S + ' = ' + a[0] + ';', '\t}', '}'],
			expr: S
		};
	},
	range: (r) => IV.union(r[0], IV.pt(0))
});
def({
	id: 'lowpass', label: 'low-pass filter', cat: 'state', out: 'RAW', divs: 2, stateful: true,
	ins: [{ n: 'x', k: 'RAW' }],
	params: [{ n: 'N', label: 'N (passes)', t: 'int', min: 1, max: 65536, def: 16 },
	{ n: 'onResume', label: 'on resume', t: 'resume', def: '' }],
	help: 'first order low pass on a x1000 accumulator - NEVER the naive v += (x-v)/N, which stalls with a permanent dead band of N units. 1 static. Cost is 2 divisions and only the /N folds to a shift when N is a power of two: acc/1000 stays an __aeabi_idiv call whatever N is.',
	divsOf: (p) => isPow2(p.N) ? 1 : 2,
	sim: (c, a, p, st) => {
		if (st.acc === undefined) st.acc = 0;
		st.acc = chk32(st.acc + idiv(mulChecked(a[0], 1000, 'low-pass x*1000') - st.acc, p.N), 'low-pass acc');
		return idiv(st.acc, 1000);
	},
	emit: (c, a, p, nd) => {
		const S = c.stat(nd, 'acc', 'int32_t', '0');
		c.resetIf(nd, [S + ' = 0;']);
		return {
			lines: ['/* low-pass on a x1000 accumulator, see README_MIX_EDITOR_API 9.2 */',
				S + ' += (' + par(a[0]) + ' * 1000 - ' + S + ') / ' + p.N + ';'],
			expr: S + ' / 1000'
		};
	},
	range: (r) => {
		const acc = IV.union(IV.mulK(r[0], 1000), IV.pt(0));
		if (!IV.fits(acc)) return { lo: acc.lo, hi: acc.hi, bad: 'x * 1000' };
		return IV.union(r[0], IV.pt(0));
	}
});
def({
	id: 'integrator', label: 'integrator', cat: 'state', out: 'RAW', divs: 0, stateful: true,
	ins: [{ n: 'x', k: 'RAW' }, { n: 'reset', k: 'BOOL' }],
	params: [{ n: 'lo', label: 'anti-windup min', t: 'int', min: -2000000000, max: 2000000000, def: -1000000 },
	{ n: 'hi', label: 'anti-windup max', t: 'int', min: -2000000000, max: 2000000000, def: 1000000 },
	{ n: 'onResume', label: 'on resume', t: 'resume', def: '' }],
	help: 'accumulates x every pass with a MANDATORY FAC_math_clamp_to anti-windup bound and a reset input. 1 static, 0 div. An unbounded integrator eventually overflows, which is undefined behaviour - this block refuses to emit one. Scale the result afterwards with div scaled or from range.',
	sim: (c, a, p, st) => {
		if (st.acc === undefined) st.acc = 0;
		if (a[1]) st.acc = 0;
		st.acc = m_clamp_to(chk32(st.acc + a[0], 'integrator'), p.lo, p.hi);
		return st.acc;
	},
	emit: (c, a, p, nd) => {
		const S = c.stat(nd, 'acc', 'int32_t', '0');
		c.resetIf(nd, [S + ' = 0;']);
		return {
			lines: ['if (' + par(a[1]) + ') {', '\t' + S + ' = 0;', '}',
				S + ' = FAC_math_clamp_to(' + S + ' + ' + par(a[0]) + ', ' + p.lo + ', ' + p.hi + ');'],
			expr: S
		};
	},
	range: (r, p) => {
		const step = IV.add(IV.clampTo(IV.mk(p.lo, p.hi), p.lo, p.hi), r[0]);
		if (!IV.fits(step)) return { lo: step.lo, hi: step.hi, bad: 'acc + x' };
		return IV.mk(Math.min(p.lo, p.hi), Math.max(p.lo, p.hi));
	}
});
def({
	id: 'timer', label: 'timer / periodic gate', cat: 'state', out: 'BOOL', divs: 0, stateful: true, nowNeeded: true,
	ins: [],
	params: [{ n: 'ms', label: 'period ms', t: 'int', min: 1, max: 600000, def: 500 },
	{ n: 'onResume', label: 'on resume', t: 'resume', def: '' }],
	help: 'goes to 1 for exactly one pass every period. 1 static, 0 div. Always compares (uint32_t)(now - t0) >= period, never now > t0 + period, which breaks across the 49.7 day tick wrap.',
	sim: (c, a, p, st) => {
		if (st.t === undefined) st.t = 0;
		if (((c.tick - st.t) >>> 0) >= p.ms) { st.t = c.tick; return 1; }
		return 0;
	},
	emit: (c, a, p, nd) => {
		const T = c.stat(nd, 't0', 'uint32_t', '0'), F = c.tmp('tick');
		c.resetIf(nd, [T + ' = now;']);
		return {
			lines: ['uint8_t ' + F + ' = 0;',
				'if ((uint32_t) (now - ' + T + ') >= ' + p.ms + ') {', '\t' + T + ' = now;', '\t' + F + ' = 1;', '}'],
			expr: F, bound: true
		};
	},
	range: () => IV_BOOL
});

/* per-node effective values ------------------------------------------------ */
function nodeDef(n) { return NODES[n.t]; }
function nodeOutKind(n) { const d = NODES[n.t]; return d.outKind ? d.outKind(n.p) : d.out; }
function nodeDivs(n) { const d = NODES[n.t]; return d.divsOf ? d.divsOf(n.p) : d.divs; }
/* sanitise a user label into a C identifier fragment */
function cName(s) {
	let v = String(s == null ? '' : s).trim().replace(/[^A-Za-z0-9_]+/g, '_').replace(/^_+|_+$/g, '');
	if (!v) v = 'value';
	if (/^[0-9]/.test(v)) v = '_' + v;
	return v;
}
function lcName(s) { return cName(s).toLowerCase(); }
/* lower_snake -> lowerCamel, for local variable names */
function camel(s) {
	const parts = cName(s).toLowerCase().split('_').filter(x => x.length);
	if (!parts.length) return 'value';
	return parts[0] + parts.slice(1).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');
}
/* ==========================================================================
 * SECTION: GRAPH
 * The project model, the topological order and undo/redo.
 * A wire is (fromNode -> toNode.port). At most one wire per input port: there
 * is no implicit fan-in, a user who wants to combine two signals has to say
 * with which block. Fan-out is unlimited.
 * ========================================================================== */
const SCHEMA_VERSION = 1;
let P = null;              /* the project */
let uid = 1;
function newId() { return 'n' + (uid++); }

function blankProject(mode) {
	return {
		schemaVersion: SCHEMA_VERSION,
		mode: mode || 'mix',
		title: mode === 'function' ? 'my function' : 'my mix',
		author: '',
		description: '',
		instances: 1,
		imuFallback: '',                        /* '' = not chosen yet, 'zero' | 'hold' */
		embedJson: true,
		nodes: [], wires: [],
		collapsed: {},                          /* group name -> collapsed, purely visual */
		view: { x: 60, y: 40, z: 1 },
		reg: { mixCount: 2, fnCount: 11 },      /* the firmware this tool was written against */
		sim: {
			deadzonePerc: 2,
			chAssign: [2, 1, 0, 0, 0, 0, 0, 0],   /* fac_settings.c defaults: IN1<-ch2, IN2<-ch1 */
			reverse: [0, 0, 0, 0, 0, 0, 0, 0],
			fnChannels: [3, 0, 0, 0, 0, 0, 0, 0, 0],
			stage0: [500, 500, 0, 500, 500, 500, 500, 500],
			mapper: { M1: 100, M2: 101, M3: 0, S1: 200, S2: 0 },
			rcHz: 50, speed: 1, disarmMs: 3000,
			gyro: [0, 0, 0], accel: [0, 0, 1000], gen: 'const', genAmp: 8000, genHz: 1,
			imuFail: 0, batteryMv: 8000, cells: 2, adc: [2048, 2048, 1500], rxConnected: 1
		},
		pad: { index: 0, bindings: null }
	};
}

function nodeById(id) { return P.nodes.find(n => n.id === id); }
function wireTo(nodeId, port) { return P.wires.find(w => w.to === nodeId && w.port === port); }
function wiresFrom(nodeId) { return P.wires.filter(w => w.from === nodeId); }

function addNode(type, x, y) {
	const d = NODES[type];
	const n = { id: newId(), t: type, x: Math.round(x), y: Math.round(y), p: {}, name: '', note: '', bind: 'auto', grp: '' };
	(d.params || []).forEach(pd => { n.p[pd.n] = pd.def; });
	if (type === 'mix_input' || type === 'mix_output') {
		const used = P.nodes.filter(o => o.t === type).map(o => o.p.idx);
		const lim = type === 'mix_input' ? MIXES_MAX_INPUTS_NUMBER : MIXES_MAX_OUTPUTS_NUMBER;
		for (let i = 0; i < lim; i++) if (used.indexOf(i) < 0) { n.p.idx = i; break; }
		n.p.name = (type === 'mix_input' ? 'INPUT_' : 'OUT_') + n.p.idx;
	}
	P.nodes.push(n);
	return n;
}
function removeNodes(ids) {
	const s = new Set(ids);
	P.nodes = P.nodes.filter(n => !s.has(n.id));
	P.wires = P.wires.filter(w => !s.has(w.from) && !s.has(w.to));
}
function connect(fromId, toId, port) {
	if (fromId === toId) return false;
	const d = NODES[nodeById(toId).t];
	if (!d.ins || port >= d.ins.length) return false;
	P.wires = P.wires.filter(w => !(w.to === toId && w.port === port));   /* no implicit fan-in */
	P.wires.push({ from: fromId, to: toId, port: port });
	return true;
}

/* ---- topological order. Edges into a `breaks` node (the unit delay) do not
 * order anything: that block reads its static from the previous pass, so the
 * loop it closes is legal and is exactly how feedback is expressed here. ---- */
function topoOrder() {
	const indeg = new Map(), adj = new Map();
	P.nodes.forEach(n => { indeg.set(n.id, 0); adj.set(n.id, []); });
	P.wires.forEach(w => {
		if (!indeg.has(w.from) || !indeg.has(w.to)) return;
		if (NODES[nodeById(w.to).t].breaks) return;     /* cycle breaker */
		adj.get(w.from).push(w.to);
		indeg.set(w.to, indeg.get(w.to) + 1);
	});
	/* ready nodes are taken in project order, so the generated locals come out
	 * in the order the user laid the graph out rather than in hash order */
	const rank = new Map(); P.nodes.forEach((n, i) => rank.set(n.id, i));
	const q = [], out = [];
	P.nodes.forEach(n => { if (indeg.get(n.id) === 0) q.push(n.id); });
	while (q.length) {
		q.sort((a, b) => rank.get(a) - rank.get(b));
		const id = q.shift(); out.push(id);
		adj.get(id).forEach(t => { indeg.set(t, indeg.get(t) - 1); if (indeg.get(t) === 0) q.push(t); });
	}
	const cyc = P.nodes.filter(n => out.indexOf(n.id) < 0).map(n => n.id);
	return { order: out.map(nodeById), cycle: cyc };
}

/* ---- undo / redo ---- */
let undoStack = [], redoStack = [], undoSuspend = false;
function snapshot() { return JSON.stringify({ n: P.nodes, w: P.wires, m: P.mode, i: P.instances }); }
function pushUndo() {
	if (undoSuspend) return;
	undoStack.push(snapshot());
	if (undoStack.length > 80) undoStack.shift();
	redoStack.length = 0;
}
function applySnap(s) {
	const o = JSON.parse(s);
	P.nodes = o.n; P.wires = o.w; P.mode = o.m; P.instances = o.i;
	selection = new Set();
	refreshAll();
}
function doUndo() { if (!undoStack.length) return; redoStack.push(snapshot()); applySnap(undoStack.pop()); }
function doRedo() { if (!redoStack.length) return; undoStack.push(snapshot()); applySnap(redoStack.pop()); }

/* ==========================================================================
 * SECTION: VALIDATE
 * Range analysis first (an interval per wire), then every rule of the contract.
 * error blocks export, warning does not.
 * ========================================================================== */
const KIND_WARN = {
	'RAW>NORM': 'RAW into a NORM port: convert explicitly with clamp, clamp to + from range, or from range',
	'RAW>ANGLE': 'RAW into an ANGLE port: wrap it with angle wrap first',
	'RAW>BOOL': 'RAW used as a condition: any non-zero value is true in C, which may not be what you meant',
	'NORM>ANGLE': 'NORM into an ANGLE port: 4096 units is one turn, not 1000',
	'NORM>BOOL': 'NORM used as a condition: any non-zero value is true in C',
	'ANGLE>NORM': 'ANGLE into a NORM port: 0..4095 will saturate at 1000',
	'ANGLE>BOOL': 'ANGLE used as a condition',
	'ANGLE>RAW': null, 'NORM>RAW': null, 'BOOL>RAW': null, 'BOOL>NORM': null, 'BOOL>ANGLE': null
};

let ANALYSIS = null;   /* {ranges:Map, findings:[], divs, statics, sqrtCount, order} */

function analyse() {
	const F = [];
	const add = (sev, msg, nodeId) => F.push({ sev: sev, msg: msg, node: nodeId || null });
	const t = topoOrder();
	const ranges = new Map();
	let divs = 0, sqrtCount = 0, statics = 0;
	const trigUse = {};

	if (t.cycle.length)
		add('error', 'cycle with no stateful break (' + t.cycle.length + ' nodes). Only a "previous value" block can close a loop.', t.cycle[0]);

	/* mode sanity + duplicated indices + parameter limits */
	const outIdx = {}, inIdx = {}, rxCh = {};
	P.nodes.forEach(n => {
		const d = NODES[n.t];
		if (!d) { add('error', 'unknown block type "' + n.t + '"', n.id); return; }
		if (d.modes && d.modes.indexOf(P.mode) < 0)
			add('error', d.label + ' does not exist in ' + P.mode + ' mode', n.id);
		if (n.t === 'mix_output') { (outIdx[n.p.idx] = outIdx[n.p.idx] || []).push(n.id); }
		if (n.t === 'mix_input') { (inIdx[n.p.idx] = inIdx[n.p.idx] || []).push(n.id); }
		if (n.t === 'rx_channel') { (rxCh[n.p.ch] = rxCh[n.p.ch] || []).push(n.id); }
		if (n.t === 'fn_output' && P.nodes.filter(o => o.t === 'fn_output').length > 1)
			add('error', 'a special function has exactly one output', n.id);
	});
	Object.keys(outIdx).forEach(k => { if (outIdx[k].length > 1) add('error', 'output index ' + k + ' is written by ' + outIdx[k].length + ' blocks', outIdx[k][1]); });
	Object.keys(inIdx).forEach(k => { if (inIdx[k].length > 1) add('warn', 'input index ' + k + ' is read by ' + inIdx[k].length + ' blocks - harmless, but one block is enough', inIdx[k][1]); });
	Object.keys(rxCh).forEach(k => { if (rxCh[k].length > 1) add('warn', 'channel ' + k + ' is read by ' + rxCh[k].length + ' direct RX blocks - the generator emits one local, but one block is clearer', rxCh[k][1]); });

	/* unconnected required ports */
	P.nodes.forEach(n => {
		const d = NODES[n.t]; if (!d) return;
		(d.ins || []).forEach((ip, i) => {
			if (!wireTo(n.id, i)) add('error', 'port "' + ip.n + '" is not connected', n.id);
		});
	});

	/* kind checks on every wire */
	P.wires.forEach(w => {
		const fn = nodeById(w.from), tn = nodeById(w.to);
		if (!fn || !tn) return;
		const fk = nodeOutKind(fn), tk = (NODES[tn.t].ins[w.port] || {}).k;
		if (!fk || !tk || fk === tk) return;
		if (NODES[tn.t].sink) return;   /* the dedicated "RAW into an output" finding below says it better */
		const msg = KIND_WARN[fk + '>' + tk];
		if (msg) add('warn', msg + ' (' + NODES[fn.t].label + ' -> ' + NODES[tn.t].label + ')', tn.id);
	});

	/* ---- interval propagation, in topological order ----
	 * A unit delay reads the previous pass, so its interval depends on a node
	 * that comes LATER in the order. Iterate to a fixpoint, widening as we go;
	 * a loop that has not converged after 12 rounds is genuinely unbounded (an
	 * accumulator with no clamp, say), and is widened to the whole int32_t range
	 * so the group 4 "not proven to fit" rule below fires on it. */
	const breakNodes = P.nodes.filter(n => NODES[n.t] && NODES[n.t].breaks);
	let feedback = new Map();
	breakNodes.forEach(n => feedback.set(n.id, IV.pt(0)));
	const onePass = (fb, collect) => {
		const R = new Map();
		t.order.forEach(n => {
			const d = NODES[n.t]; if (!d) return;
			const args = (d.ins || []).map((ip, i) => {
				const w = wireTo(n.id, i);
				return w && R.has(w.from) ? R.get(w.from) : IV.pt(0);
			});
			let r;
			if (d.breaks) r = fb.get(n.id);
			else { try { r = d.range(args, n.p, n); } catch (e) { r = IV.mk(I32_MIN, I32_MAX); } }
			if (collect) collect(n, d, args, r);
			/* a violated constraint is reported once, on the node that owns it: the
			 * interval handed downstream is clipped so the same error does not echo
			 * along the rest of the graph */
			R.set(n.id, (r && (r.bad || !IV.fits(r))) ? IV.mk(Math.max(I32_MIN, r.lo), Math.min(I32_MAX, r.hi)) : r);
		});
		return R;
	};
	if (breakNodes.length) {
		for (let it = 0; it < 12; it++) {
			const R = onePass(feedback, null);
			let stable = true;
			const next = new Map();
			breakNodes.forEach(n => {
				const w = wireTo(n.id, 0);
				const seen = w && R.has(w.from) ? IV.union(R.get(w.from), IV.pt(0)) : IV.pt(0);
				const old = feedback.get(n.id);
				const merged = IV.union(old, seen);
				if (merged.lo !== old.lo || merged.hi !== old.hi) stable = false;
				next.set(n.id, merged);
			});
			feedback = next;
			if (stable) break;
			if (it === 11) breakNodes.forEach(n => feedback.set(n.id, IV.mk(I32_MIN, I32_MAX)));
		}
	}
	onePass(feedback, (n, d, args, r0) => {
		let r = r0;
		ranges.set(n.id, r);
		if (r && r.bad) {
			add('error', 'range constraint violated: ' + r.bad + ' would be ' + IV.str(r) + ', outside int32_t / the primitive limit', n.id);
			r = IV.mk(Math.max(I32_MIN, r.lo), Math.min(I32_MAX, r.hi));
		}
		ranges.set(n.id, r);

		/* group 4 has no clamp and no guard: an interval that is not PROVEN to
		 * fit int32_t is an error here, not a warning */
		if (d.cat === 'g4' && !IV.fits(r))
			add('error', 'group 4 result ' + IV.str(r) + ' is not proven to fit int32_t - signed overflow is undefined behaviour', n.id);
		else if (!IV.fits(r))
			add('error', 'intermediate ' + IV.str(r) + ' does not fit int32_t', n.id);

		divs += nodeDivs(n);
		if (d.sqrt) sqrtCount++;
		if (d.stateful) statics += 1;
		if (['expo', 'sin', 'cos', 'atan2'].indexOf(n.t) >= 0) trigUse[n.t] = (trigUse[n.t] || 0) + 1;

		/* per block parameter rules */
		if (n.t === 'raw_div_lit' && Number(n.p.k) === 0) add('error', 'raw / k with k = 0', n.id);
		if (n.t === 'to_range' && Math.abs(n.p.omax - n.p.omin) >= 1000000)
			add('error', '(out_max - out_min) must stay below 10^6, it is ' + Math.abs(n.p.omax - n.p.omin), n.id);
		if (n.t === 'from_range' && Math.abs(n.p.imax - n.p.imin) >= 1000000)
			add('error', '(in_max - in_min) must stay below 10^6, it is ' + Math.abs(n.p.imax - n.p.imin), n.id);
		if (n.t === 'from_range' && n.p.imax === n.p.imin) add('warn', 'in_max == in_min: the primitive returns 0 for every input', n.id);
		if (n.t === 'scale' && Math.abs(n.p.percent) > 10000) add('warn', 'percent is clipped to +-10000 by the primitive', n.id);
		if (n.t === 'expo' && n.p.amount > 1000) add('warn', 'amount is clipped to 1000 by the primitive', n.id);
		if (n.t === 'lowpass' && !isPow2(n.p.N)) add('warn', 'filter N = ' + n.p.N + ' is not a power of two, so the /N stays an __aeabi_idiv call', n.id);
		if (n.t === 'mul_scaled' && Number(n.p.scale) === 0) add('warn', 'scale = 0: the primitive returns 0 for every input', n.id);
		if (n.t === 'div_scaled' && args[1] && args[1].lo <= 0 && args[1].hi >= 0)
			add('warn', 'b can be 0 here - the primitive guards it and returns 0, make sure that is the behaviour you want', n.id);
		if (n.t === 'sqrt' && ranges.get(n.id) && args[0].lo < 0) add('warn', 'sqrt of a possibly negative value returns 0', n.id);
		if (n.t === 'rx_channel') add('warn', 'direct RX channel read bypasses the user-configurable mix input channel setting', n.id);
		if (n.t === 'rx_connected') add('warn', 'RX connected latches TRUE on the first frame and NEVER returns to FALSE - it is not a failsafe', n.id);
		if (n.t === 'setting') add('warn', 'reading a setting ties the graph to a code that is FAC Tool ABI - bake tuning constants in as literals instead', n.id);
		if (d.stateful && !n.p.onResume)
			add('warn', 'no reset/hold decision for the disarm gap - pick one in the inspector', n.id);
	});

	/* RAW straight into an output */
	P.nodes.filter(n => NODES[n.t] && NODES[n.t].sink).forEach(n => {
		const w = wireTo(n.id, 0); if (!w) return;
		const src = nodeById(w.from); if (!src) return;
		if (nodeOutKind(src) === 'RAW') {
			const r = ranges.get(src.id);
			if (r && (r.lo < V_MIN || r.hi > V_MAX))
				add('warn', 'a RAW value ' + IV.str(r) + ' goes straight into an output: the boilerplate final FAC_math_clamp will saturate it silently', n.id);
		}
	});

	/* dead nodes: everything that cannot reach a sink */
	const alive = new Set();
	const fwd = new Map();
	P.nodes.forEach(n => fwd.set(n.id, []));
	P.wires.forEach(w => { if (fwd.has(w.from)) fwd.get(w.from).push(w.to); });
	const back = new Map(); P.nodes.forEach(n => back.set(n.id, []));
	P.wires.forEach(w => { if (back.has(w.to)) back.get(w.to).push(w.from); });
	const stack = P.nodes.filter(n => NODES[n.t] && NODES[n.t].sink).map(n => n.id);
	while (stack.length) {
		const id = stack.pop(); if (alive.has(id)) continue; alive.add(id);
		(back.get(id) || []).forEach(x => stack.push(x));
		const nd = nodeById(id);
		/* a unit delay keeps its feeding branch alive even though the edge is
		 * not an ordering constraint */
		if (nd && NODES[nd.t] && NODES[nd.t].breaks) (back.get(id) || []).forEach(x => stack.push(x));
	}
	P.nodes.forEach(n => { if (!alive.has(n.id)) add('warn', 'dead block: nothing it computes reaches an output', n.id); });

	/* whole-graph rules */
	const usesIMU = P.nodes.some(n => NODES[n.t] && NODES[n.t].imu);
	if (usesIMU && !P.imuFallback)
		add('error', 'the IMU status guard needs an explicit fallback - choose one in the Sensors tab (hold last output, or FAC_VALUE_ZERO)', null);
	if (divs > 10) add('warn', divs + ' divisions per pass: on a 48 MHz M0 without a hardware divider that is starting to matter', null);
	Object.keys(trigUse).forEach(k => {
		if (trigUse[k] > 1) add('warn', k + ' is used ' + trigUse[k] + ' times (' + NODES[k].divs + ' divisions each) - a shared subexpression would be cheaper', null);
	});
	if (P.mode === 'function') {
		const last = P.reg.fnCount + Number(P.instances);
		if (last > SPECIAL_FUNCITONS_NUMBER)
			add('error', 'FAC_SPECIAL_FUNCTION_LAST would become ' + last + ', above SPECIAL_FUNCITONS_NUMBER (' + SPECIAL_FUNCITONS_NUMBER + '): the framework arrays are only 20 entries', null);
		if (!P.nodes.some(n => n.t === 'fn_output')) add('error', 'no Function output block', null);
	} else {
		if (!P.nodes.some(n => n.t === 'mix_output')) add('error', 'no Mix output block', null);
	}
	if (!cName(P.title)) add('error', 'the project needs a title - the file names are derived from it', null);

	ANALYSIS = {
		ranges: ranges, findings: F, divs: divs, sqrtCount: sqrtCount, statics: statics,
		order: t.order, cycle: t.cycle, usesIMU: usesIMU
	};
	return ANALYSIS;
}
function hasErrors() { return ANALYSIS && ANALYSIS.findings.some(f => f.sev === 'error'); }
/* ==========================================================================
 * SECTION: CODEGEN
 * The generator owns exactly four regions of the template:
 *   - the /* CUSTOM INCLUDE *\/ block
 *   - the file scope statics under /* PRIVATE FUNCTIONS AND VARIABLES *\/
 *   - the DESCRIPTION comment and the #define INPUT_* / OUTPUT_* lines
 *   - the body between /* INSERT YOUR CODE HERE -START- *\/ and -END-
 * Everything else is byte identical to the template, including the 9 step
 * recipe header, with the four bounded exceptions the committed examples
 * already make (file name, Created on / Author, the ID and function name, and
 * the (void) parameter list that fac_simple_tank_mix.c:93 already writes).
 * ========================================================================== */
const ORD = ['1ST', '2ND', '3RD', '4TH', '5TH', '6TH', '7TH', '8TH', '9TH'];

function projName() { return lcName(P.title); }
function upName() { return cName(P.title).toUpperCase(); }
function fileBase() { return 'fac_' + projName() + (P.mode === 'mix' ? '_mix' : '_function'); }
function updateFn() { return 'FAC_' + projName() + (P.mode === 'mix' ? '_mix_update' : '_function_update'); }
function mixEnum() { return 'FAC_MIX_' + upName(); }
function fnEnum(i) {
	const base = 'FAC_SPECIAL_FUNCTION_' + upName();
	return Number(P.instances) > 1 ? base + '_' + ORD[i] : base;
}
function exportDate() {
	const d = new Date();
	return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function authorName() { return (P.author || '').trim() || 'F.A.C. mix editor'; }

/* -------------------------------------------------------------- emitter ctx */
function makeCtx() {
	const N = Math.max(1, Number(P.instances) || 1);
	const multi = P.mode === 'function' && N > 1;
	const used = new Set(['inputs', 'outputs', 'input', 'output', 'now', 'i',
		'instanceSlot', 'functionArrayPosition', 'mix_id', 'first_special_function_id']);
	const ctx = {
		N: N, multi: multi,
		statics: [], resets: [], incAdc: false, incImu: false, incOther: new Set(),
		needNow: false, rxLocals: {}, rxLines: [],
		uniq: function (base) {
			let nm = base || 'value', k = 2;
			while (used.has(nm)) { nm = base + k; k++; }
			used.add(nm); return nm;
		},
		tmp: function (base) { return ctx.uniq(camel(base)); },
		/* declare a file scope static. For a multi instance special function it
		 * is ALWAYS an array indexed by the instance slot - a shared scalar
		 * across instances is the single most likely defect in generated code,
		 * so the generator makes it unrepresentable. */
		stat: function (nd, suffix, ctype, init) {
			const base = ctx.uniq(camel((nd.name || NODES[nd.t].label) + ' ' + suffix));
			const zero = (init === '0' || init === 'FAC_VALUE_ZERO');
			let decl;
			if (multi) {
				decl = 'static ' + ctype + ' ' + base + '[' + N + ']' +
					(zero ? '' : ' = { ' + new Array(N).fill(init).join(', ') + ' }') + ';';
			} else {
				decl = 'static ' + ctype + ' ' + base + (zero ? '' : ' = ' + init) + ';';
			}
			ctx.statics.push(decl);
			return multi ? base + '[instanceSlot]' : base;
		},
		resetIf: function (nd, lines) { if (nd.p.onResume === 'reset') lines.forEach(l => ctx.resets.push(l)); },
		rxLocal: function (ch) {
			if (!ctx.rxLocals[ch]) {
				const nm = ctx.uniq('rxCh' + ch);
				ctx.rxLocals[ch] = nm;
				/* GET_channel is not a free field read, it re-runs the backend:
				 * read each channel once into a local */
				ctx.rxLines.push('uint16_t ' + nm + ' = FAC_std_receiver_GET_channel(' + ch + ');');
			}
			return ctx.rxLocals[ch];
		},
		inc: function (h) {
			if (h === 'FAC_Code/fac_adc.h') ctx.incAdc = true;
			else if (h === 'FAC_Code/fac_imu.h') ctx.incImu = true;
			else ctx.incOther.add(h);
		}
	};
	return ctx;
}

const C_TYPE = { NORM: 'fac_value_t', BOOL: 'uint8_t', ANGLE: 'int32_t', RAW: 'int32_t' };

/* ------------------------------------------------------------- graph body */
function genBody(ctx) {
	const a = analyse();
	const order = a.order;
	const expr = {};        /* nodeId -> C expression (a local name, or inlined) */
	const body = [], deferred = [], assigns = [];

	/* which results MUST be bound to a local: multi-use consumers and fan-out */
	const mustBind = new Set();
	P.nodes.forEach(n => {
		const d = NODES[n.t]; if (!d) return;
		if (wiresFrom(n.id).length > 1) mustBind.add(n.id);
		if (d.multiUse) P.wires.filter(w => w.to === n.id).forEach(w => mustBind.add(w.from));
	});

	order.forEach(n => {
		const d = NODES[n.t]; if (!d) return;
		if (d.imu) ctx.incImu = true;
		if (d.inc) ctx.inc(d.inc);
		if (d.nowNeeded) ctx.needNow = true;
		if (d.stateful) ctx.needNow = true;    /* the disarm guard needs the tick */

		const args = (d.ins || []).map((ip, i) => {
			const w = wireTo(n.id, i);
			return w && expr[w.from] !== undefined ? expr[w.from] : 'FAC_VALUE_ZERO';
		});
		const r = d.emit(ctx, args, n.p, n) || {};
		if (r.assign !== undefined) { assigns.push({ node: n, line: r.assign }); return; }
		if (r.lines) r.lines.forEach(l => body.push(l));

		if (r.bound) { expr[n.id] = r.expr; }
		else {
			const auto = !d.noBind && (mustBind.has(n.id) || !!n.name || (r.lines && r.lines.length) ||
				String(r.expr).length > 34 || d.stateful);
			const bind = n.bind === 'always' ? true : n.bind === 'never' ? false : auto;
			/* never alias a name to a name: a bare identifier (or a per-instance
			 * static) is already the local the reader wants */
			if (bind && !/^[A-Za-z_][A-Za-z0-9_]*(\[instanceSlot\])?$/.test(r.expr)) {
				const nm = ctx.uniq(camel(n.name || defaultLocalName(n)));
				const ty = C_TYPE[nodeOutKind(n)] || 'int32_t';
				if (n.note) body.push('/* ' + n.note.replace(/\*\//g, '* /') + ' */');
				body.push(ty + ' ' + nm + ' = ' + r.expr + ';');
				expr[n.id] = nm;
			} else {
				expr[n.id] = r.expr;
			}
		}
		if (r.post) r.post.forEach(l => deferred.push(l));
		if (r.postFn) deferred.push({ node: n, fn: r.postFn });
	});

	/* outputs, in index order. An unconnected output is simply not written: the
	 * boilerplate already zero-initialized it, so a redundant assignment would
	 * only be noise. */
	assigns.sort((x, y) => (x.node.p.idx || 0) - (y.node.p.idx || 0));
	assigns.forEach(x => { if (wireTo(x.node.id, 0)) body.push(x.line); });
	/* the cycle breakers store their static LAST, when every expression is known */
	deferred.forEach(l => {
		if (typeof l === 'string') { body.push(l); return; }
		const args = (NODES[l.node.t].ins || []).map((ip, i) => {
			const w = wireTo(l.node.id, i);
			return w && expr[w.from] !== undefined ? expr[w.from] : 'FAC_VALUE_ZERO';
		});
		l.fn(args).forEach(x => body.push(x));
	});
	return body;
}
function defaultLocalName(n) {
	if (n.t === 'mix_input') return 'in ' + n.p.name;
	if (n.t === 'const') return 'k' + n.p.v;
	return NODES[n.t].label;
}

/* --------------------------------------------------------------- assemble */
function generate() {
	const ctx = makeCtx();
	const bodyLines = genBody(ctx);
	const a = ANALYSIS;
	const N = ctx.N;
	const anyState = ctx.statics.length > 0;
	const imuHold = a.usesIMU && P.imuFallback === 'hold';

	/* the disarm gap guard, README_MIX_EDITOR_API 9.4 */
	let pre = [];
	if (ctx.multi && (anyState || imuHold)) {
		pre.push('/* every static below is per instance: a shared scalar would make all');
		pre.push(' * the instances of this function fight over one state */');
		pre.push('uint8_t instanceSlot = (uint8_t) (sFunctionID - ' + fnEnum(0) + ');');
		pre.push('if (instanceSlot >= ' + N + ') {');
		pre.push('\tinstanceSlot = 0;\t/* defensive: the dispatcher only passes our own IDs */');
		pre.push('}');
	}
	if (ctx.needNow) pre.push('uint32_t now = HAL_GetTick();');
	if (anyState) {
		const LR = ctx.multi ? 'lastRun[instanceSlot]' : 'lastRun';
		ctx.statics.unshift('static uint32_t ' + (ctx.multi ? 'lastRun[' + N + ']' : 'lastRun') + ';');
		pre.push('/* the chain only runs in FAC_STATE_NORMAL, so a disarm freezes every static.');
		pre.push(' * More than 100 ms since the last pass means we were not running. */');
		pre.push('if ((uint32_t) (now - ' + LR + ') > 100) {');
		if (ctx.resets.length) ctx.resets.forEach(l => pre.push('\t' + l));
		else pre.push('\t/* every stateful block of this graph is set to HOLD: nothing to reset */');
		pre.push('}');
		pre.push(LR + ' = now;');
	}
	ctx.rxLines.forEach(l => pre.push(l));

	/* the IMU preamble wraps the whole graph: FAC_IMU_update() once at the top,
	 * then the mandatory status guard with the user's chosen fallback */
	let core = [];
	const holdArr = P.mode === 'mix' ? 'imuLastOutputs' : 'imuLastOutput';
	if (a.usesIMU) {
		core.push('FAC_IMU_update();\t/* the main loop does NOT do this for us */');
		core.push('if (FAC_IMU_GET_status() != HAL_ERROR) {');
		bodyLines.forEach(l => core.push('\t' + l));
		if (imuHold) {
			core.push('\t/* remember the good outputs so the fallback below can hold them */');
			if (P.mode === 'mix') {
				ctx.statics.push('static fac_value_t ' + holdArr + '[MIXES_MAX_OUTPUTS_NUMBER];');
				core.push('\tfor (int i = 0; i < MIXES_MAX_OUTPUTS_NUMBER; i++) {');
				core.push('\t\t' + holdArr + '[i] = outputs[i];');
				core.push('\t}');
			} else {
				ctx.statics.push('static fac_value_t ' + holdArr + (ctx.multi ? '[' + N + ']' : '') + ';');
				core.push('\t' + holdArr + (ctx.multi ? '[instanceSlot]' : '') + ' = output;');
			}
		}
		core.push('} else {');
		if (imuHold) {
			core.push('\t/* IMU fallback: hold the last outputs computed while the sensor was healthy.');
			core.push('\t * A dead sensor reads exactly like a sensor holding perfectly still, which is');
			core.push('\t * why this branch exists at all. */');
			if (P.mode === 'mix') {
				core.push('\tfor (int i = 0; i < MIXES_MAX_OUTPUTS_NUMBER; i++) {');
				core.push('\t\toutputs[i] = ' + holdArr + '[i];');
				core.push('\t}');
			} else {
				core.push('\toutput = ' + holdArr + (ctx.multi ? '[instanceSlot]' : '') + ';');
			}
		} else {
			core.push('\t/* IMU fallback: every output stays at FAC_VALUE_ZERO, which is what the');
			core.push('\t * boilerplate already zero-initialized them to. Nothing to do. */');
		}
		core.push('}');
	} else {
		core = bodyLines;
	}

	const region = pre.concat(core);
	const cFile = P.mode === 'mix' ? buildMixC(ctx, region) : buildFunctionC(ctx, region, N);
	const hFile = P.mode === 'mix' ? buildMixH() : buildFunctionH();

	/* the multi-instance assertion the validator promises: with more than one
	 * instance every static must be indexed, never shared */
	let assertMsg = null;
	if (ctx.multi) {
		const bad = ctx.statics.filter(s => s.indexOf('[' + N + ']') < 0);
		if (bad.length) assertMsg = 'internal: unindexed state in a multi-instance function: ' + bad.join(' ');
	}
	return { c: cFile, h: hFile, statics: ctx.statics, assertMsg: assertMsg };
}

/* --------------------------------------------------- the two include blocks */
function includeBlock(ctx, forFunction) {
	const L = [];
	L.push('/* CUSTOM INCLUDE */' + (forFunction ? '\t\t\t\t\t\t\t\t\t\t// 8) of HOW TO MAKE A SPECIAL FUNCTION' : '\t\t\t\t\t\t\t\t\t\t// 8) of HOW TO MAKE A MIX'));
	L.push((ctx.incAdc ? '' : '//') + '#include "FAC_Code/fac_adc.h"');
	/* the templates write fac_fac_imu.h, which does not exist. The header is
	 * Core/Inc/FAC_Code/fac_imu.h, and it already pulls Libraries/LSM6DS3.h so
	 * X_AXIS / Y_AXIS / Z_AXIS come with this single include. */
	L.push((ctx.incImu ? '' : '//') + '#include "FAC_Code/fac_imu.h"\t\t// if get_status == HAL_ERROR NOT USE data!!');
	Array.from(ctx.incOther).sort().forEach(h => L.push('#include "' + h + '"'));
	return L.join('\n');
}

function descriptionBlock() {
	const notes = P.nodes.filter(n => n.note && n.note.trim()).map(n => ' * - ' + (n.name || NODES[n.t].label) + ': ' + n.note.trim());
	const d = (P.description || '').trim() || 'generated with the F.A.C. V2 graphical mix editor';
	const L = d.split('\n').map(l => (' * ' + l).replace(/\s+$/, ''));
	if (notes.length) { L.push(' *'); L.push(' * BLOCK NOTES:'); notes.forEach(x => L.push(x)); }
	return L.join('\n');
}
function inputDefines() {
	const L = [];
	for (let i = 0; i < MIXES_MAX_INPUTS_NUMBER; i++) {
		const n = P.nodes.find(o => o.t === 'mix_input' && o.p.idx === i);
		L.push(n ? '#define INPUT_' + cName(n.p.name).toUpperCase() + ' ' + i : '//#define INPUT_NOT_USED ' + i);
	}
	return L.join('\n');
}
function outputDefines() {
	const L = [];
	for (let i = 0; i < MIXES_MAX_OUTPUTS_NUMBER; i++) {
		const n = P.nodes.find(o => o.t === 'mix_output' && o.p.idx === i);
		L.push(n ? '#define OUTPUT_' + cName(n.p.name).toUpperCase() + ' ' + i : '//#define OUTPUT_NOT_USED ' + i);
	}
	return L.join('\n');
}
function staticsBlock(ctx) {
	if (!ctx.statics.length) return '';
	return '\n/* GRAPH STATE - file scope statics, zero initialized at boot, NOT touched by\n' +
		' * FAC_mixes_init() / FAC_functions_init(), so they survive an apply and a disarm */\n' +
		ctx.statics.join('\n');
}
function jsonTrailer() {
	if (!P.embedJson) return '';
	/* "*\/" cannot appear inside a block comment, and \/ is a legal JSON escape */
	const j = JSON.stringify(projectForSave()).split('*/').join('*\\/');
	return '\n\n/* FAC_MIX_EDITOR_PROJECT v' + SCHEMA_VERSION + ' - re-import this file to keep editing\n' +
		'FACMIX_JSON_BEGIN\n' + j + '\nFACMIX_JSON_END\n*/\n';
}

/* ------------------------------------------------------------------ mix .c */
function buildMixC(ctx, region) {
	return '/*\n' +
		' * ' + fileBase() + '.c\t// 1) of HOW TO MAKE A MIX\n' +
		' *\n' +
		' *\tHOW TO MAKE A MIX:\n' +
		' *\t1) Copy this file and the fac_template_mix.h.template and rename\n' +
		' *\t\twith the name of the new mix (ex: fac_simple_tank_mix.c/h)\n' +
		' *\t\tIn the .h files, update the #ifndef and #define with the new name.\n' +
		' *\t2) Fix the include to match the new name you have choose\n' +
		' *\t3) Add to the FAC_MIXES_ID on fac_mixes.h file the new FAC_MIX\n' +
		' *\t\t(ex: FAC_MIX_SIMPLE_TANK) and set it to the mix_id\n' +
		' *\t4) Rename the FAC_<name>_mix_update() function on this file and\n' +
		' *\t\ton the fac_name_mix.h\n' +
		' *\t5) Add the FAC_<name>_mix_update() function into a new case into\n' +
		' *\t\tthe fac_mixes.c file inside the FAC_mix_update() function using\n' +
		' *\t\tas case value your mix_id value.\n' +
		' *\t6) Add the include header file of your new mix inside the\n' +

			L.push('The first ones are linkable, the rest are not until the five `max` values are raised to');
			L.push('`200+' + lastIdx + '`.');
		} else {

			L.push('Link a device to it by setting the mapper value to `200+' + firstIdx + '` = **' + (200 + firstIdx) + '**.');
		}
		L.push('');
		L.push('> On the firmware this tool was written against there are **' + Math.max(0, SPECIAL_FUNCITONS_NUMBER - fnCount) + ' free IDs** before');
		L.push('> `FAC_SPECIAL_FUNCTION_LAST` overruns the framework arrays, and **' + Math.max(0, 11 - fnCount) + '** before new IDs stop');
		L.push('> being linkable to a device at all. They are different limits with different');
		L.push('> consequences, which is why both are shown.');
		L.push('');
		L.push('## 6. Refresh the STM32CubeIDE project');
		L.push('');
		L.push('A new `.c` has to be picked up by `Debug/**/subdir.mk`, which is **generated** and holds');
		L.push('absolute paths. Refresh / regenerate the project from the IDE, or the file is **silently');
		L.push('not compiled**. Never hand-edit anything under `Debug/`.');
		L.push('');
		L.push('## 7. Point an input channel at it');
		L.push('');
		L.push('`FAC_SETTINGS_CODE_SPECIAL_FUNCTION<n>_INPUT_CHANNEL` selects the receiver channel of');
		L.push('slot *n*; **0 disables the slot** and the function is then not executed at all.');

	L.push('');
	L.push('`FIRMWARE_VERSION_TAG` is a hash of MAJOR/MINOR/PATCH. Bumping it makes the boot code');

	L.push('written, 3 = a normal load.');
	L.push('');
	L.push('---');
	L.push('');
	L.push('## Conformance checklist (README_MIX_EDITOR_API section 13)');
	L.push('');
	L.push('Ticked = verified mechanically by the editor. Unticked = only a build can confirm it.');
	L.push('');

	const ck = (ok, s) => L.push('- [' + (ok ? 'x' : ' ') + '] ' + s);
	L.push('**Structure**');

	ck(true, 'boilerplate byte-identical to the template outside the marked regions (the `if (0)` placeholder deleted' +

	ck(true, 'update function declared `' + (isMix ? '(void)' : '(uint8_t sFunctionID)') + '`, matching in `.c`, `.h` and the snippet above');
	ck(true, '`' + (isMix ? 'mix_id' : 'first_special_function_id') + '` present, `static const uint8_t`, `__attribute__((unused))` kept');
	ck(true, '`INPUT_*` / `OUTPUT_*` defines present for every used index, numbers not renumbered');
	ck(!!(P.description || '').trim(), 'a real `DESCRIPTION` block, in English');
	ck(true, 'every identifier used has its header included (no `main.h`, so no `TRUE`/`FALSE`; no `stdlib.h`, so no `abs()`)');
	L.push('');
	L.push('**Correctness**');
	ck(true, 'no `float`, `double`, `math.h`, `malloc`, `HAL_Delay`, blocking loop, recursion, VLA - the block catalogue cannot express any of them');
	ck(true, 'no motor, servo, settings-write, EEPROM or USB call');
	ck(!a.findings.some(f => f.sev === 'error'), 'every `FAC_math_*` call respects its documented range constraint');
	ck(!a.findings.some(f => f.sev === 'error'), 'every intermediate proven to fit `int32_t` over the full input domain (interval analysis on every wire)');
	ck(true, 'no division by a possibly-zero value outside the guarded primitives (`raw / k` requires a non-zero literal)');
	ck(true, 'all 10 outputs written or left at `FAC_VALUE_ZERO`');
	L.push('');
	if (a.usesIMU) {
		L.push('**IMU**');
		ck(true, '`FAC_IMU_update()` called once, at the top of the generated region');
		ck(true, '`FAC_IMU_GET_status() != HAL_ERROR` guard present, fallback = ' + (P.imuFallback === 'hold' ? 'hold the last outputs' : 'FAC_VALUE_ZERO'));
		L.push('');
	}
	if (a.statics) {
		L.push('**State**');
		ck(true, 'all state is file-scope `static` and correct when zero-initialized');
		ck(true, P.mode === 'function' && Number(P.instances) > 1
			? 'multi-instance: every static is an array indexed by `sFunctionID` (asserted by the generator)'
			: 'single instance: scalar state is correct here');
		ck(true, 'time comparisons use `(uint32_t)(now - then) >= period`');
		ck(true, 'a staleness guard covers the disarm gap, with an explicit reset-or-hold decision per block');
		ck(true, 'filters keep their state on a x1000 accumulator, never the naive `v += (x-v)/N`');
		L.push('');
	}
	L.push('**Simulation parity**');
	ck(SELFTEST.ran && SELFTEST.fail === 0, 'the editor self-test is green (' + (SELFTEST.ran ? SELFTEST.pass + ' assertions' : 'NOT RUN') + '): truncation, clamp order, guarded returns, unsigned sqrt, the receiver deadzone port and the simple tank parity grid');
	L.push('');
	L.push('**Registration**');
	ck(false, 'enum entry appended before `_LAST`, never inserted');
	ck(false, 'dispatcher `case` and `#include` added');
	if (!isMix) ck(false, '`FAC_SPECIAL_FUNCTION_LAST` still <= 20, mapper `max` raised if the new index exceeds 10');
	ck(false, 'STM32CubeIDE project refreshed so `subdir.mk` picks up the new `.c`');
	ck(false, '**the build is `-Wall` clean** - this is the last step and only the IDE can confirm it');
	L.push('');
	return L.join('\n');
}

function projectForSave() {
	return {
		schemaVersion: SCHEMA_VERSION, mode: P.mode, title: P.title, author: P.author,
		description: P.description, instances: P.instances, imuFallback: P.imuFallback,
		embedJson: P.embedJson, nodes: P.nodes, wires: P.wires, collapsed: P.collapsed, view: P.view,
		reg: P.reg, sim: P.sim, pad: { index: P.pad.index, bindings: PAD.bindings }
	};
}
function loadProject(o) {
	if (!o || !o.nodes) throw new Error('not a F.A.C. mix editor project');
	const b = blankProject(o.mode || 'mix');
	P = Object.assign(b, o);
	P.sim = Object.assign(b.sim, o.sim || {});
	P.reg = Object.assign(b.reg, o.reg || {});
	P.pad = Object.assign({ index: 0, bindings: null }, o.pad || {});
	if (P.pad.bindings) PAD.bindings = P.pad.bindings;
	uid = 1;
	P.nodes.forEach(n => { const k = parseInt(String(n.id).slice(1), 10); if (k >= uid) uid = k + 1; });
	P.nodes.forEach(n => { if (n.bind === undefined) n.bind = 'auto'; if (n.note === undefined) n.note = ''; if (n.grp === undefined) n.grp = ''; });
	if (!P.collapsed || typeof P.collapsed !== 'object') P.collapsed = {};

}
function download(name, text) {
	/* the firmware tree is CRLF, so the generated sources are written CRLF too */
	const crlf = /\.(c|h)$/.test(name) ? text.replace(/\r?\n/g, '\r\n') : text;
	const b = new Blob([crlf], { type: 'text/plain;charset=utf-8' });
	const u = URL.createObjectURL(b), a = document.createElement('a');
	a.href = u; a.download = name; a.click();
	setTimeout(() => URL.revokeObjectURL(u), 1500);
}
function importFromC(text) {
	const i = text.indexOf('FACMIX_JSON_BEGIN'), j = text.indexOf('FACMIX_JSON_END');
	if (i < 0 || j < 0) throw new Error('this .c carries no embedded project (round-trip was off when it was exported)');

}
/* ==========================================================================
 * SECTION: SIM
 * A fixed 1 ms step driving a simulated HAL_GetTick(). It calls exactly the
 * same catalogue sim() functions the code generator maps onto - there is no
 * second implementation of the math, ever.
 *
 * It also reproduces the two structures the generator wraps around the graph,
 * because both change behaviour: the IMU status guard with its fallback, and
 * the disarm gap guard with its per block reset/hold policy.
 * ========================================================================== */
const SIM = {
	tick: 0, running: true, stepOnce: false, acc: 0, lastFrameMs: 0,
	stage0: [500, 500, 0, 500, 500, 500, 500, 500],
	stage1: [0, 0, 0, 0, 0, 0, 0, 0],
	mixIn: [0, 0, 0, 0, 0, 0, 0, 0],
	outputs: new Array(MIXES_MAX_OUTPUTS_NUMBER).fill(0),
	fnOut: new Array(SPECIAL_FUNCITONS_NUMBER).fill(0),
	values: {},                 /* nodeId -> last value, for the live wire labels */
	errors: {},                 /* nodeId -> overflow message */
	st: {},                     /* 'nodeId|slot' -> state object */
	lastRun: {},                /* slot -> tick of the last executed pass */
	imuHold: null, imuHoldFn: {},
	lastRcFrame: 0, held0: null,
	disarmLeft: 0, passes: 0, lastError: '',

	robot: { x: 0, y: 0, th: 0 },

	reset: function () {

	stateOf: function (nodeId, slot) {

	 * and the browser only polls a pad at display rate, so holding the value in
	 * between is a better model than re-sampling every simulated pass. */
	updateChannels: function () {
		const s = P.sim, hz = Number(s.rcHz) || 0;

		if (this.held0 === null) this.held0 = this.stage0.slice();

		}

	},
	/* stage 1 -> stage 2, exactly as FAC_mixes_update_mix_inputs() does it */
	updateMixInputs: function () {
		const s = P.sim;
		for (let i = 0; i < MIXES_MAX_INPUTS_NUMBER; i++) {
			const ch = Number(s.chAssign[i]) | 0;
			this.mixIn[i] = ch === 0 ? V_ZERO : rxStage2(this.stage1[ch - 1], !!s.reverse[i]);

	},
	fnInputOf: function (slot) {
		const ch = Number(P.sim.fnChannels[slot] || 0) | 0;
