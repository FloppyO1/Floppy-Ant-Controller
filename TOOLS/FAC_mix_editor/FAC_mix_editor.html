	},

	simContext: function (slot) {
		const s = P.sim, self = this;

			inputs: this.mixIn, fnInput: this.fnInputOf(slot), fnOutput: 0,
			outputs: this.outputs, tick: this.tick, slot: slot,
			imu: { gyro: s.gyro, accel: s.accel },
			adc: (i) => s.adc[i] | 0, adcRes: 4096,
			ch: (n) => (n >= 1 && n <= RECEIVER_CHANNELS_NUMBER) ? self.stage1[n - 1] : 0,
			rxConnected: !!s.rxConnected,
			batteryMv: Number(s.batteryMv) | 0,

	/* one 1 ms pass of the superloop */
	step: function () {

		this.updateChannels();

		this.updateMixInputs();
		this.passes++;
		const a = ANALYSIS || analyse();
		const N = P.mode === 'function' ? Math.max(1, Number(P.instances) || 1) : 1;

	runGraph: function (a, slot) {

		const lr = this.lastRun[slot] === undefined ? 0 : this.lastRun[slot];
		if (((this.tick - lr) >>> 0) > 100) {
			P.nodes.forEach(n => {

			});
			try {
				vals[n.id] = d.sim(c, args, n.p, this.stateOf(n.id, slot));

			} catch (e) {
				vals[n.id] = 0; this.errors[n.id] = e.message; err = e.message;

		a.order.forEach(n => {
			const d = NODES[n.t];
			if (!d || !d.simPost) return;
			const args = (d.ins || []).map((ip, i) => {
				const w = wireTo(n.id, i);
				return w && vals[w.from] !== undefined ? vals[w.from] : 0;

	deviceValue: function (link) {

	/* the two device conversions of fac_mapper.c, mirrored exactly so the Robot

	servoPosition: function (v) {           /* fac_mapper.c:102 -> 0 .. MAX_SERVO_VALUE */

	},
	motorSpeed: function (v) {              /* fac_mapper.c:77 - exact, both resolutions are 1000 */
		return idiv(m_abs(v) * MOTOR_SPEED_RESOLUTION, V_MAX);
	},

	applyGenerators: function () {
		const s = P.sim;
		if (!s.genTarget || s.genTarget === 'none') return;
		const t = this.tick / 1000, A = Number(s.genAmp) || 0, f = Number(s.genHz) || 1;
		let v = 0;

		else if (s.gen === 'sweep') v = Math.round(A * Math.sin(2 * Math.PI * (0.2 + f * t * 0.15) * t));
		else if (s.gen === 'noise') v = Math.round((Math.random() * 2 - 1) * A);

	integrateRobot: function () {
		/* ILLUSTRATIVE ONLY, not a physical model: a plain differential drive on
		 * whatever the mapper sends to M1 and M2 */
		const l = this.deviceValue(P.sim.mapper.M1), r = this.deviceValue(P.sim.mapper.M2);
		const L = (l === null ? 0 : l) / 1000, R = (r === null ? 0 : r) / 1000;
		const v = (L + R) / 2, w = (R - L) / 2;
		const dt = 0.001;

		this.robot.x += Math.cos(this.robot.th) * v * 120 * dt;
		this.robot.y += Math.sin(this.robot.th) * v * 120 * dt;
		this.robot.x = Math.max(-160, Math.min(160, this.robot.x));
		this.robot.y = Math.max(-110, Math.min(110, this.robot.y));
	},

	traceValue: function (t) {
		if (t.kind === 'node') return this.values[t.id] === undefined ? 0 : this.values[t.id];
		if (t.kind === 'out') return this.outputs[t.id] | 0;
		if (t.kind === 'fn') return this.fnOut[t.id] | 0;
		if (t.kind === 'ch') return this.stage1[t.id] | 0;
		if (t.kind === 'in') return this.mixIn[t.id] | 0;
		return 0;
	},
	pushScope: function () {
		const S = this.scope;
		if (S.paused || !S.traces.length) return;
		S.traces.forEach(t => { t.buf[S.idx] = this.traceValue(t); });

		if (S.count < S.cap) S.count++;
	},
	addTrace: function (kind, id, label) {
		if (this.scope.traces.length >= 8) return;
		if (this.scope.traces.some(t => t.kind === kind && t.id === id)) return;
		const cols = ['#00adb5', '#ff8a65', '#9ede9f', '#f0c2df', '#e4e9a8', '#b8cdf0', '#d5c2f0', '#f4564a'];
		this.scope.traces.push({ kind: kind, id: id, label: label, buf: new Int32Array(this.scope.cap), col: cols[this.scope.traces.length] });

/* ==========================================================================
 * SECTION: GAMEPAD
 * The pad writes THE SAME eight stage-0 values 0..1000 the sliders write, and
 * nothing downstream can tell them apart. That is the whole point: what you
 * tune with a stick is what the receiver will feed on the robot.
 *
 * navigator.getGamepads() hands out FLOATS. They die in padToStage0() below and
 * nowhere else - no float may ever reach the graph math, or the browser stops
 * agreeing with the MCU, which is this tool's entire reason to exist.
 * ========================================================================== */
const PAD = {
	available: typeof navigator !== 'undefined' && !!navigator.getGamepads,
	pads: [], index: 0, connected: false, id: '', mapping: '',

	bindings: null,

		b[1] = Object.assign(b[1], { src: 'axis', idx: 3, invert: 1 });      /* CH2 right stick Y */
		b[2] = Object.assign(b[2], { src: 'axis', idx: 1, invert: 1 });      /* CH3 left stick Y  */

		b[4] = Object.assign(b[4], { src: 'button', idx: 6, btn: 'momentary' });  /* CH5 left trigger  */

		}

	},
	/* THE FLOAT BOUNDARY. Everything above this line is float, everything below
	 * is an integer 0..1000 and every rule of the FAC_MATH section applies. */
	padToStage0: function (b, rawVal) {
		let v = rawVal - b.center;

					else b.pos = (b.pos + 1) % 3;

				raw = b.btn === 'toggle' ? (b.tog ? 1 : -1) : (b.pos === 0 ? -1 : b.pos === 1 ? 0 : 1);

			SIM.stage0[i] = this.padToStage0(b, raw);

		for (let i = 0; i < this.raw.buttons.length; i++) {
			if (this.raw.buttons[i] > 0.6) {
				this.bindings[this.learnCh].src = 'button'; this.bindings[this.learnCh].idx = i;
				this.learnCh = -1; uiPad(); return;
			}

	}

/* ==========================================================================
 * SECTION: SELFTEST
 * The tool must not let anyone export from a build whose math does not agree
 * with itself. Every assertion here is either a value read straight out of
 * fac_math.h / fac_std_receiver.c or a property those files guarantee.
 * ========================================================================== */
const SELFTEST = { ran: false, pass: 0, fail: 0, log: [] };

function T(name, got, want) {
	const ok = String(got) === String(want);
	if (ok) SELFTEST.pass++; else { SELFTEST.fail++; SELFTEST.log.push({ ok: 0, name: name, got: String(got), want: String(want) }); }
	return ok;
}
function Tok(name, cond, detail) {
	if (cond) SELFTEST.pass++; else { SELFTEST.fail++; SELFTEST.log.push({ ok: 0, name: name, got: detail || 'false', want: 'true' }); }
	return !!cond;
}

/* the reference transcription of fac_simple_tank_mix.c:113-141, used only as a
 * test oracle. It calls the same FAC_MATH port everything else calls. */
function tankReference(inThrottle, inSteering) {
	let left = inThrottle + inSteering;
	let right = inThrottle - inSteering;
	const diff = m_abs(inThrottle) - m_abs(inSteering);
	const ad = diff < 0 ? -diff : diff;
	left = left < 0 ? left - ad : left + ad;
	right = right < 0 ? right - ad : right + ad;
	return [m_clamp(idiv(left, 2)), m_clamp(idiv(right, 2))];
}

/* run a mix project once, headless, on a given input vector */
function headlessMix(proj, inputs) {
	const save = P;
	P = proj;
	let out;
	try {
		const a = analyse();
		out = new Array(MIXES_MAX_OUTPUTS_NUMBER).fill(0);
		const c = {
			inputs: inputs, outputs: out, tick: 0, fnInput: 0, fnOutput: 0, slot: 0,
			imu: { gyro: [0, 0, 0], accel: [0, 0, 0] }, adc: () => 0, adcRes: 4096,
			ch: () => 0, rxConnected: true, batteryMv: 8000, cellMv: 4000, setting: () => 0
		};
		const vals = {}, st = {};
		a.order.forEach(n => {
			const d = NODES[n.t]; if (!d) return;
			const args = (d.ins || []).map((ip, i) => {
				const w = P.wires.find(x => x.to === n.id && x.port === i);
				return w && vals[w.from] !== undefined ? vals[w.from] : 0;
			});
			st[n.id] = st[n.id] || {};
			vals[n.id] = d.sim(c, args, n.p, st[n.id]);
		});
	} finally { P = save; }
	return out.map(m_clamp);
}

			const a1 = analyse();
			Tok('a bounded feedback loop through the unit delay converges and is accepted',
				!a1.findings.some(f => f.sev === 'error'),

			 * fixpoint cannot prove it fits int32_t, so it must be an ERROR */
			b = PB('mix', 'fb2', 'x');

			pv = b.n('prev', 100, 100, { onResume: 'reset' }, 'last');
			s = b.n('raw_add', 200, 0, {}, 'sum');
			o = b.n('mix_output', 400, 0, { idx: 0, name: 'O' });

			const a2 = analyse();
			Tok('an unbounded accumulator fed back through the unit delay is refused',
				a2.findings.some(f => f.sev === 'error'), 'no error raised');
		} finally { P = save; }
	})();

	(function () {
		const save = P;

		['stdlib.h', /stdlib\.h/], ['malloc', /\bmalloc\b/], ['HAL_Delay', /HAL_Delay/],
		['TRUE/FALSE', /\b(TRUE|FALSE)\b/], ['a shift', /(>>|<<)/],
		['a device write', /FAC_(motors|servo|led|buzzer)_/i], ['a settings write', /FAC_settings_SET/],
		['while/goto', /\b(while|goto)\b/]];

			Object.keys(PRESETS).forEach(k => {
				P = PRESETS[k]();
				if (!P.imuFallback) P.imuFallback = 'zero';
				P.embedJson = false;
				analyse();
				let src;
				try { src = generate().c; } catch (e) { Tok('preset "' + k + '" generates', false, e.message); return; }
				/* comments are stripped first: the boilerplate REMEMBER block itself
				 * says "NEVER a float" and names fac_math.h */
				const body = src.split('-START- */')[1].split('/* INSERT YOUR CODE HERE -END- */')[0]
					.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/[^\n]*/g, '');
				banned.forEach(bn => Tok('preset "' + k + '" emits no ' + bn[0], !bn[1].test(body), 'found ' + bn[0] + ' in: ' + (body.match(bn[1]) || [''])[0]));
			});
		} finally { P = save; }
	})();

	SELFTEST.ran = true;
	uiSelfTestBanner();
	uiTest();
	return SELFTEST;
}

/* ==========================================================================
 * SECTION: PRESETS
 * They double as regression fixtures - simple_tank is the acceptance test for
 * group 4 above.
 * ========================================================================== */
function PB(mode, title, description) {
	const p = blankProject(mode);
	p.title = title; p.description = description;
	let k = 1;
	const api = {
		p: p,
		n: function (t, x, y, params, name, grp) {
			const d = NODES[t], nd = { id: 'p' + (k++), t: t, x: x, y: y, p: {}, name: name || '', note: '', bind: 'auto', grp: grp || '' };
			(d.params || []).forEach(pd => { nd.p[pd.n] = pd.def; });
			Object.assign(nd.p, params || {});
			p.nodes.push(nd);
			return nd.id;
		},
		w: function (from, to, port) { p.wires.push({ from: from, to: to, port: port || 0 }); return api; },
		done: function () { return p; }
	};
	return api;
}

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.prototype.slice.call(document.querySelectorAll(s));
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

let selection = new Set();
let dragState = null;
const NODE_GEOM = {};   /* nodeId -> {w,h} measured after render */

/* ---------------------------------------------------------- move dragging
 * A move drag resolves the elements it will touch ONCE, at mousedown, instead
 * of looking them up per frame.
 *
 * That is also what makes a collapsed group draggable at all: its members are
 * NOT rendered - renderNodes() skips them through isHidden() and draws a single
 * box carrying data-grp instead - so a per-frame '.node[data-id=...]' lookup
 * matched nothing, the box stayed put, and the whole group only jumped into
 * place on the refreshAll() at mouseup. */
function collectMoveTargets(ids) {
	/* one pass over the rendered nodes into two lookups. A group name is user
	 * typed, so it must never be interpolated into a CSS selector. */
	/* null prototype: a group named "constructor" would otherwise resolve to
	 * Object.prototype.constructor and crash the drag on the first frame */
	const byId = Object.create(null), byGroup = Object.create(null);
	$$('#nodes .node').forEach(e => {
		if (e.dataset.grp) byGroup[e.dataset.grp] = e;
		else if (e.dataset.id) byId[e.dataset.id] = e;
	});
	const doms = [], boxes = [], seenGroup = Object.create(null);
	ids.forEach(id => {
		const n = nodeById(id); if (!n) return;
		if (isHidden(n)) {
			/* behind a collapsed box: move the box, once, however many of its
			 * members the selection happens to contain */
			if (seenGroup[n.grp]) return;
			seenGroup[n.grp] = 1;
			const be = byGroup[n.grp];
			if (be) boxes.push({ g: n.grp, el: be, members: P.nodes.filter(m => m.grp === n.grp) });
			return;
		}
		if (byId[id]) doms.push({ n: n, el: byId[id] });
	});
	return { doms: doms, boxes: boxes };
}

function beginMoveDrag(e) {
	const wp = worldPos(e);
	dragState = { kind: 'move', ox: wp.x, oy: wp.y, start: {}, doms: [], boxes: [] };
	selection.forEach(sid => { const n = nodeById(sid); if (n) dragState.start[sid] = { x: n.x, y: n.y }; });
	const t = collectMoveTargets(Array.prototype.slice.call(selection));
	dragState.doms = t.doms; dragState.boxes = t.boxes;
}

/* the model is updated on every mousemove, the DOM at most once per frame */
let moveRaf = 0;
function scheduleMoveFrame() {
	if (moveRaf) return;
	moveRaf = requestAnimationFrame(() => { moveRaf = 0; applyMoveFrame(); });
}
function cancelMoveFrame() { if (moveRaf) { cancelAnimationFrame(moveRaf); moveRaf = 0; } }
function applyMoveFrame() {
	const ds = dragState; if (!ds || ds.kind !== 'move') return;
	ds.doms.forEach(d => { d.el.style.left = d.n.x + 'px'; d.el.style.top = d.n.y + 'px'; });
	ds.boxes.forEach(b => {
		/* the box origin is the top left corner of its members, the same rule
		 * renderNodes() uses, so the box lands where the cursor released it and
		 * an expand afterwards shows the members at their own offsets */
		const x = Math.min.apply(null, b.members.map(m => m.x));
		const y = Math.min.apply(null, b.members.map(m => m.y));
		b.el.style.left = x + 'px'; b.el.style.top = y + 'px';
		const gb = GROUP_BOX[b.g];
		if (gb) { gb.x = x; gb.y = y; }   /* portPos() reads this, so the wires follow too */
	});
	renderWires();   /* at most once per frame, whatever the selection size */
}

/* Starting a drag does not need a full re-render. refreshAll() re-runs
 * analyse(), rebuilds the generated code and the registration guide and
 * autosaves - none of which a mousedown can have invalidated. Toggling the
 * class and refreshing the inspector is the whole of a selection change. */
function syncSelectionUI() {
	$$('#nodes .node').forEach(e => {
		const sel = e.dataset.grp
			? P.nodes.some(n => n.grp === e.dataset.grp && selection.has(n.id))
			: selection.has(e.dataset.id);
		e.classList.toggle('sel', sel);
	});
	uiInspector();
}

/* --------------------------------------------------------------- palette */
function uiPalette() {
	const body = $('#palBody'), q = ($('#palSearch').value || '').toLowerCase();
	body.innerHTML = '';
	const byCat = {};
	Object.keys(NODES).forEach(id => {
		const d = NODES[id];
		if (d.modes && d.modes.indexOf(P.mode) < 0) return;
		if (q && (d.label + ' ' + id + ' ' + d.help).toLowerCase().indexOf(q) < 0) return;
		(byCat[d.cat] = byCat[d.cat] || []).push(d);
	});
	Object.keys(CAT).forEach(c => {
		if (!byCat[c]) return;
		const h = el('div', 'catHead');
		h.appendChild(el('span', null, CAT[c]));
		h.appendChild(el('span', null, String(byCat[c].length)));
		body.appendChild(h);
		byCat[c].forEach(d => {
			const b = el('div', 'blk');
			b.appendChild(el('span', null, d.label + (d.adv ? ' *' : '')));
			const divs = d.divsOf ? '?' : d.divs;
			b.appendChild(el('span', 'bd', d.sqrt ? '16 st' : (divs + ' div')));
			b.title = d.help + (d.adv ? '\n\n(*) advanced' : '');
			b.draggable = true;
			b.addEventListener('dragstart', e => e.dataTransfer.setData('text/fac', d.id));
			b.addEventListener('dblclick', () => {
				pushUndo();
				const n = addNode(d.id, (-P.view.x + 300) / P.view.z, (-P.view.y + 200) / P.view.z);
				selection = new Set([n.id]); refreshAll();
			});
			body.appendChild(b);
		});
	});
}

/* ---------------------------------------------------------------- canvas */
function worldPos(e) {
	const r = $('#viewport').getBoundingClientRect();
	return { x: (e.clientX - r.left - P.view.x) / P.view.z, y: (e.clientY - r.top - P.view.y) / P.view.z };
}
function applyView() {
	$('#world').style.transform = 'translate(' + P.view.x + 'px,' + P.view.y + 'px) scale(' + P.view.z + ')';
}

/* ---- groups. Purely visual: collapsing one hides its blocks behind a single
 * box and re-routes the wires that cross the boundary onto it. The graph, the
 * validation, the simulation and the generated code are all unaffected. ---- */
const GROUP_BOX = {};
function groupNames() {
	const s = [];
	P.nodes.forEach(n => { if (n.grp && s.indexOf(n.grp) < 0) s.push(n.grp); });
	return s.sort();
}
function groupOf(id) {
	const n = nodeById(id);
	return (n && n.grp && P.collapsed[n.grp]) ? '#grp:' + n.grp : id;
}
function isHidden(n) { return !!(n.grp && P.collapsed[n.grp]); }
function uiGroups() {
	const host = $('#groups'); host.innerHTML = '';
	groupNames().forEach(g => {
		const members = P.nodes.filter(n => n.grp === g);
		const c = el('span', 'chip' + (P.collapsed[g] ? '' : ' on'), (P.collapsed[g] ? '▶ ' : '▼ ') + g + ' (' + members.length + ')');
		c.title = (P.collapsed[g] ? 'expand' : 'collapse') + ' this group';
		c.onclick = () => { P.collapsed[g] = !P.collapsed[g]; refreshAll(); };
		host.appendChild(c);
	});
}

function renderNodes() {
	const host = $('#nodes');
	host.innerHTML = '';
	Object.keys(GROUP_BOX).forEach(k => delete GROUP_BOX[k]);
	const errN = {}, warnN = {};
	(ANALYSIS ? ANALYSIS.findings : []).forEach(f => { if (f.node) { if (f.sev === 'error') errN[f.node] = 1; else warnN[f.node] = 1; } });

	/* one box per collapsed group, placed at the top left corner of its members */
	groupNames().forEach(g => {
		if (!P.collapsed[g]) return;
		const members = P.nodes.filter(n => n.grp === g);
		const x = Math.min.apply(null, members.map(n => n.x));
		const y = Math.min.apply(null, members.map(n => n.y));
		const bad = members.some(n => errN[n.id]), warn = members.some(n => warnN[n.id]);
		const e = el('div', 'node cat-group' + (members.some(n => selection.has(n.id)) ? ' sel' : '') + (bad ? ' err' : (warn ? ' warn' : '')));
		e.dataset.grp = g;
		e.style.left = x + 'px'; e.style.top = y + 'px';
		e.appendChild(el('div', 'nh', '▶ ' + g));
		const nb = el('div', 'nb'); nb.appendChild(el('div', 'prow', 'in'));
		e.appendChild(nb);
		e.appendChild(el('div', 'sub', members.length + ' blocks collapsed'));
		const op = el('div', 'port o'); op.dataset.id = '#grp:' + g; op.dataset.out = '1'; op.style.cursor = 'default';
		e.appendChild(op);
		host.appendChild(e);
		GROUP_BOX[g] = { x: x, y: y, w: e.offsetWidth || 140, h: e.offsetHeight || 60 };
		NODE_GEOM['#grp:' + g] = GROUP_BOX[g];
	});

	P.nodes.forEach(n => {
		if (isHidden(n)) return;
		const d = NODES[n.t];
		const e = el('div', 'node cat-' + (d ? d.cat : 'g1') + (selection.has(n.id) ? ' sel' : '') +
			(n.grp ? ' grouped' : '') + (errN[n.id] ? ' err' : (warnN[n.id] ? ' warn' : '')));
		e.dataset.id = n.id;
		e.style.left = n.x + 'px'; e.style.top = n.y + 'px';
		e.appendChild(el('div', 'nh', n.name || (d ? d.label : n.t)));
		const nb = el('div', 'nb');
		(d && d.ins ? d.ins : []).forEach((ip, i) => {
			const row = el('div', 'prow', ip.n);
			const p = el('div', 'port i'); p.dataset.port = i; p.dataset.id = n.id;
			p.title = ip.k;
			row.appendChild(p);
			nb.appendChild(row);
		});
		if (!(d && d.ins && d.ins.length)) nb.appendChild(el('div', 'prow', ' '));
		e.appendChild(nb);
		const sub = paramSummary(n);
		if (sub) e.appendChild(el('div', 'sub', sub));
		if (d && !d.sink) {
			const op = el('div', 'port o'); op.dataset.id = n.id; op.dataset.out = '1';
			op.title = nodeOutKind(n);
			e.appendChild(op);
		}
		const v = SIM.values[n.id];
		const vv = el('div', 'val' + (v < 0 ? ' n' : ''), SIM.errors[n.id] ? 'OVERFLOW' : (v === undefined ? '-' : String(v)));
		if (SIM.errors[n.id]) vv.style.color = 'var(--err)';
		e.appendChild(vv);
		host.appendChild(e);
		NODE_GEOM[n.id] = { w: e.offsetWidth, h: e.offsetHeight };
	});
}
function paramSummary(n) {
	const d = NODES[n.t]; if (!d || !d.params || !d.params.length) return '';
	return d.params.filter(pd => pd.t !== 'resume').map(pd => {
		let v = n.p[pd.n];
		if (pd.t === 'sel' && pd.opts) { const o = pd.opts.find(x => x[0] === String(v)); if (o) v = o[1]; }
		return pd.label + '=' + v;
	}).join('  ');
}
function portPos(nodeId, port) {
	if (String(nodeId).indexOf('#grp:') === 0) {
		const b = GROUP_BOX[String(nodeId).slice(5)] || { x: 0, y: 0, w: 140, h: 60 };
		return port === 'out' ? { x: b.x + b.w + 1, y: b.y + b.h / 2 } : { x: b.x - 1, y: b.y + b.h / 2 };
	}
	const n = nodeById(nodeId); if (!n) return { x: 0, y: 0 };
	const g = NODE_GEOM[nodeId] || { w: 120, h: 60 };
	if (port === 'out') return { x: n.x + g.w + 1, y: n.y + 29.5 };
	return { x: n.x - 1, y: n.y + 29.5 + 15 * port };
}
let WIRE_ELS = [];
function renderWires(temp) {
	const svg = $('#wires');
	svg.innerHTML = '';
	WIRE_ELS = [];
	const NS = 'http://www.w3.org/2000/svg';
	const mk = (a, b, cls) => {
		const dx = Math.max(30, Math.abs(b.x - a.x) * 0.5);
		const dstr = 'M' + a.x + ',' + a.y + ' C' + (a.x + dx) + ',' + a.y + ' ' + (b.x - dx) + ',' + b.y + ' ' + b.x + ',' + b.y;
		const p = document.createElementNS(NS, 'path'); p.setAttribute('d', dstr); if (cls) p.setAttribute('class', cls);
		svg.appendChild(p);
		return p;
	};
	const seen = {};
	P.wires.forEach((w, i) => {
		const fa = groupOf(w.from), ta = groupOf(w.to);
		const collapsedWire = fa !== w.from || ta !== w.to;
		if (fa === ta && collapsedWire) return;               /* internal to a collapsed group */
		if (collapsedWire) { const k = fa + '>' + ta; if (seen[k]) return; seen[k] = 1; }
		const a = portPos(fa, 'out'), b = portPos(ta, collapsedWire && ta !== w.to ? 0 : w.port);
		const path = mk(a, b, '');
		const hit = mk(a, b, 'hit');
		hit.style.pointerEvents = 'stroke';
		/* a wire drawn onto a collapsed box stands for one or more real wires, so
		 * it is not clickable: expand the group to edit them */
		if (!collapsedWire) hit.addEventListener('click', ev => { ev.stopPropagation(); pushUndo(); P.wires.splice(i, 1); refreshAll(); });
		hit.addEventListener('mouseenter', () => path.setAttribute('class', 'sel'));
		hit.addEventListener('mouseleave', () => path.setAttribute('class', ''));
		let t = null;
		if (P.view.z > 0.6 && !collapsedWire) {
			t = document.createElementNS(NS, 'text');
			t.setAttribute('x', (a.x + b.x) / 2); t.setAttribute('y', (a.y + b.y) / 2 - 3);
			t.setAttribute('text-anchor', 'middle');
			svg.appendChild(t);
		}
		WIRE_ELS.push({ from: w.from, path: path, text: t });
	});
	if (temp) { const p = mk(temp.a, temp.b, 'sel'); p.setAttribute('stroke-dasharray', '5 4'); }
	updateWireValues();
}
/* the live pass only touches the colour and the label, so a hovered wire keeps
 * its highlight and 60 fps does not mean rebuilding the whole SVG */
function updateWireValues() {
	WIRE_ELS.forEach(e => {
		const v = SIM.values[e.from];
		e.path.setAttribute('stroke', v === undefined ? '' : (v > 0 ? '#3d7f8c' : v < 0 ? '#8c5a3d' : '#4a4a4a'));
		if (e.text) e.text.textContent = v === undefined ? '' : String(v);
	});
}

function frameAll() {
	if (!P.nodes.length) { P.view = { x: 60, y: 40, z: 1 }; applyView(); return; }
	let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
	P.nodes.forEach(n => {
		const g = NODE_GEOM[n.id] || { w: 130, h: 70 };
		x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y);
		x1 = Math.max(x1, n.x + g.w); y1 = Math.max(y1, n.y + g.h);
	});
	const r = $('#viewport').getBoundingClientRect();
	const z = Math.max(0.25, Math.min(1.4, Math.min((r.width - 80) / (x1 - x0 + 1), (r.height - 80) / (y1 - y0 + 1))));
	P.view.z = z;
	P.view.x = -x0 * z + (r.width - (x1 - x0) * z) / 2;
	P.view.y = -y0 * z + (r.height - (y1 - y0) * z) / 2;
	applyView();
}

function initCanvas() {
	const vp = $('#viewport');
	vp.addEventListener('dragover', e => e.preventDefault());
	vp.addEventListener('drop', e => {
		e.preventDefault();
		const t = e.dataTransfer.getData('text/fac'); if (!t || !NODES[t]) return;
		const w = worldPos(e);
		pushUndo();
		const n = addNode(t, w.x - 50, w.y - 20);
		selection = new Set([n.id]); refreshAll();
	});
	vp.addEventListener('wheel', e => {
		e.preventDefault();
		const r = vp.getBoundingClientRect();
		const mx = e.clientX - r.left, my = e.clientY - r.top;
		const f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
		const nz = Math.max(0.2, Math.min(2.5, P.view.z * f));
		P.view.x = mx - (mx - P.view.x) * (nz / P.view.z);
		P.view.y = my - (my - P.view.y) * (nz / P.view.z);
		P.view.z = nz; applyView(); renderWires();
	}, { passive: false });

	vp.addEventListener('mousedown', e => {
		const portEl = e.target.closest ? e.target.closest('.port') : null;
		const nodeEl = e.target.closest ? e.target.closest('.node') : null;
		if (portEl) {
			e.preventDefault(); e.stopPropagation();
			const id = portEl.dataset.id;
			if (portEl.dataset.out) dragState = { kind: 'wire', from: id, a: portPos(id, 'out'), b: portPos(id, 'out') };
			else {
				/* dragging from a connected input detaches the wire */
				const port = +portEl.dataset.port, w = wireTo(id, port);
				if (w) { pushUndo(); P.wires = P.wires.filter(x => x !== w); dragState = { kind: 'wire', from: w.from, a: portPos(w.from, 'out'), b: worldPos(e) }; refreshAll(); }
				else dragState = { kind: 'wireBack', to: id, port: port, a: worldPos(e), b: portPos(id, port) };
			}
			return;
		}
		if (nodeEl && nodeEl.dataset.grp) {
			/* a collapsed group box moves, selects and deletes as its members */
			const g = nodeEl.dataset.grp;
			const ids = P.nodes.filter(n => n.grp === g).map(n => n.id);
			if (!e.shiftKey) selection = new Set();
			ids.forEach(x => selection.add(x));
			pushUndo();
			beginMoveDrag(e);
			syncSelectionUI();
			return;
		}
		if (nodeEl) {
			const id = nodeEl.dataset.id;
			if (!selection.has(id)) { if (!e.shiftKey) selection = new Set(); selection.add(id); }
			else if (e.shiftKey) { selection.delete(id); syncSelectionUI(); return; }
			pushUndo();
			beginMoveDrag(e);
			syncSelectionUI();
			return;
		}
		if (e.button === 1 || e.altKey || keyState.space) {
			dragState = { kind: 'pan', sx: e.clientX, sy: e.clientY, vx: P.view.x, vy: P.view.y };
			e.preventDefault(); return;
		}
		const w = worldPos(e);
		dragState = { kind: 'box', x0: w.x, y0: w.y, add: e.shiftKey, base: new Set(selection) };
		if (!e.shiftKey) { selection = new Set(); refreshAll(); }
	});

	window.addEventListener('mousemove', e => {
		if (!dragState) return;
		if (dragState.kind === 'move') {
			const w = worldPos(e), dx = w.x - dragState.ox, dy = w.y - dragState.oy;
			const grid = keyState.ctrl ? 1 : 10;
			selection.forEach(id => {
				const n = nodeById(id), s = dragState.start[id]; if (!n || !s) return;
				n.x = Math.round((s.x + dx) / grid) * grid; n.y = Math.round((s.y + dy) / grid) * grid;
			});
			scheduleMoveFrame();
		} else if (dragState.kind === 'wire') {
			dragState.b = worldPos(e); renderWires({ a: dragState.a, b: dragState.b });
		} else if (dragState.kind === 'wireBack') {
			dragState.a = worldPos(e); renderWires({ a: dragState.a, b: dragState.b });
		} else if (dragState.kind === 'pan') {
			P.view.x = dragState.vx + (e.clientX - dragState.sx);
			P.view.y = dragState.vy + (e.clientY - dragState.sy);
			applyView();
		} else if (dragState.kind === 'box') {
			const w = worldPos(e);
			const r = $('#viewport').getBoundingClientRect();
			let b = $('#selbox');
			if (!b) { b = el('div'); b.id = 'selbox'; $('#editor').appendChild(b); }
			const x0 = Math.min(dragState.x0, w.x) * P.view.z + P.view.x, y0 = Math.min(dragState.y0, w.y) * P.view.z + P.view.y;
			b.style.left = x0 + 'px'; b.style.top = y0 + 'px';
			b.style.width = Math.abs(w.x - dragState.x0) * P.view.z + 'px';
			b.style.height = Math.abs(w.y - dragState.y0) * P.view.z + 'px';
			dragState.x1 = w.x; dragState.y1 = w.y;
		}
	});

	window.addEventListener('mouseup', e => {
		if (!dragState) return;
		cancelMoveFrame();   /* a pending frame would write into stale elements */
		const ds = dragState; dragState = null;
		if (ds.kind === 'wire' || ds.kind === 'wireBack') {
			const t = e.target.closest ? e.target.closest('.port') : null;
			if (t) {
				if (ds.kind === 'wire' && !t.dataset.out) { pushUndo(); connect(ds.from, t.dataset.id, +t.dataset.port); }
				else if (ds.kind === 'wireBack' && t.dataset.out) { pushUndo(); connect(t.dataset.id, ds.to, ds.port); }
			}
			refreshAll();
		} else if (ds.kind === 'box') {
			const b = $('#selbox'); if (b) b.remove();
			if (ds.x1 !== undefined) {
				const xa = Math.min(ds.x0, ds.x1), xb = Math.max(ds.x0, ds.x1);
				const ya = Math.min(ds.y0, ds.y1), yb = Math.max(ds.y0, ds.y1);
				selection = ds.add ? ds.base : new Set();
				P.nodes.forEach(n => {
					if (isHidden(n)) return;
					const g = NODE_GEOM[n.id] || { w: 120, h: 60 };
					if (n.x + g.w > xa && n.x < xb && n.y + g.h > ya && n.y < yb) selection.add(n.id);
				});
			}
			refreshAll();
		} else if (ds.kind === 'move') { refreshAll(); }
	});
	$('#viewport').addEventListener('click', e => {
		if (e.target.id === 'viewport' || e.target.id === 'world') { selection = new Set(); refreshAll(); }
	});
	$('#viewport').addEventListener('dblclick', e => {
		const box = e.target.closest ? e.target.closest('.node') : null;
		if (box && box.dataset.grp) { P.collapsed[box.dataset.grp] = false; refreshAll(); }
	});
}

/* what the parameters actually mean in seconds and units - the user is a robot
 * builder, not a compiler engineer, so the tool does the arithmetic */
function derivedInfo(n) {
	const p = n.p;
	if (n.t === 'slew')
		return '<br>full travel 0 &rarr; 1000 in <b>' + Math.ceil(1000 / p.step) + '</b> passes, about <b>' +
			Math.ceil(1000 / p.step) + ' ms</b> at the nominal 1 kHz (the pass rate is only approximate)';
	if (n.t === 'slew_ms')
		return '<br>full travel 0 &rarr; 1000 in <b>' + (Math.ceil(1000 / p.step) * p.ms) + ' ms</b>, end to end -1000 &rarr; +1000 in <b>' +
			(Math.ceil(2000 / p.step) * p.ms) + ' ms</b>';
	if (n.t === 'lowpass')
		return '<br>time constant <b>' + p.N + '</b> passes, about <b>' + p.N + ' ms</b> at 1 kHz &middot; ' +
			(isPow2(p.N) ? 'N is a power of two, so the /N folds to a shift and only the /1000 stays a call' : 'N is NOT a power of two: both divisions are __aeabi_idiv calls');
	if (n.t === 'timer')
		return '<br>fires <b>' + (1000 / p.ms).toFixed(2) + '</b> times per second';
	if (n.t === 'raw_div_lit' && isPow2(p.k))
		return '<br>k is a power of two: gcc emits a shift, plus a sign correction unless it can prove the value non-negative. <b>No __aeabi_idiv call</b> - but it is still a division, not a shift, and rounds toward zero';
	if (n.t === 'battery_mv' || n.t === 'battery_cell_mv')
		return '<br>re-read <b>' + (1000 / p.ms).toFixed(1) + '</b> times per second, never per pass';
	return '';
}

function uiValidation() {
	const host = $('#valBody'); host.innerHTML = '';

	$('#vCount').style.color = e ? 'var(--err)' : (w ? 'var(--warn)' : 'var(--ok)');
	if (!F.length) { const d = el('div', 'help'); d.innerHTML = '<span style="color:var(--ok)">Nothing to report. The graph is exportable.</span>'; host.appendChild(d); return; }
	F.slice().sort((a, b) => (a.sev === b.sev ? 0 : a.sev === 'error' ? -1 : 1)).forEach(f => {
		const d = el('div', 'vitem ' + (f.sev === 'error' ? 'e' : 'w'));
		d.innerHTML = '<b>' + (f.sev === 'error' ? 'ERROR' : 'warn') + '</b> ' + esc(f.msg);
		if (f.node) d.addEventListener('click', () => { selection = new Set([f.node]); centreOn(f.node); refreshAll(); });
		host.appendChild(d);
	});
}
function centreOn(id) {
	const n = nodeById(id); if (!n) return;
	const r = $('#viewport').getBoundingClientRect();
	P.view.x = r.width / 2 - n.x * P.view.z; P.view.y = r.height / 2 - n.y * P.view.z;

}

/* ------------------------------------------------------------------ cost */
function uiCost() {
	const a = ANALYSIS; if (!a) return;
	/* an __aeabi_idiv call is roughly 20-60 cycles on an M0 at 48 MHz; the sqrt
	 * walks a fixed 16 shift-and-subtract steps. This is an order of magnitude,
	 * only FAC_debug_utils on target gives the real number. */
	const us = (a.divs * 40 + a.sqrtCount * 16 * 6 + P.nodes.length * 6) / 48;

function drawScope() {
	const cv = $('#scCanvas'); if (!cv || $('#p-scope').classList.contains('hidden')) return;
	const S = SIM.scope, ctx = cv.getContext('2d');
	const W = cv.width, H = cv.height;
	ctx.clearRect(0, 0, W, H);
	ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
	for (let i = 0; i <= 4; i++) { const y = (H * i) / 4; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
	ctx.strokeStyle = '#3a3a3a'; ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
	if (!S.traces.length) {
		ctx.fillStyle = '#555'; ctx.font = '12px sans-serif';
		ctx.fillText('add a signal to trace it - this is the only way to see a ramp, a filter, a latch or a timer behave', 12, 22);
		return;
	}
	const n = Math.min(S.count, S.windowMs);
	let peak = 1;
	S.traces.forEach(t => { for (let i = 0; i < n; i++) { const k = (S.idx - n + i + S.cap * 2) % S.cap; const v = Math.abs(t.buf[k]); if (v > peak) peak = v; } });
	const sc = (H / 2 - 6) / peak;
	S.traces.forEach(t => {
		ctx.strokeStyle = t.col; ctx.lineWidth = 1.3; ctx.beginPath();
		for (let i = 0; i < n; i++) {
			const k = (S.idx - n + i + S.cap * 2) % S.cap;
			const x = (i / Math.max(1, n - 1)) * W, y = H / 2 - t.buf[k] * sc;
			if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
		}
		ctx.stroke();
	});
	ctx.fillStyle = '#777'; ctx.font = '10px Consolas,monospace';
	ctx.fillText('+' + Math.round(peak), 4, 12);
	ctx.fillText('-' + Math.round(peak), 4, H - 4);
	ctx.fillText(n + ' ms window', W - 90, 12);
	const cur = $('#scCur');
	if (cur) cur.textContent = S.traces.map(t => t.label + '=' + t.buf[(S.idx - 1 + S.cap) % S.cap]).join('  ');
}

function drawRobot() {
	if ($('#p-robot').classList.contains('hidden')) return;
	$$('.dv').forEach(e => { const v = SIM.deviceValue(P.sim.mapper[e.dataset.k]); e.textContent = v === null ? '-' : v; });
	/* the device-unit column, straight through the mapper mirrors */
	$$('.dvu').forEach(e => {
		const k = e.dataset.k, v = SIM.deviceValue(P.sim.mapper[k]);
		if (v === null) { e.textContent = ''; return; }
		e.textContent = k.charAt(0) === 'S'
			? 'pos ' + SIM.servoPosition(v)
			: (v < 0 ? 'rev ' : 'fwd ') + SIM.motorSpeed(v);
	});
	$$('.db').forEach(e => { const v = SIM.deviceValue(P.sim.mapper[e.dataset.k]); e.innerHTML = v === null ? '' : barHtml(v, 1000); });
	const cv = $('#rbCanvas'); if (!cv) return;
	const c = cv.getContext('2d'), W = cv.width, H = cv.height;
	c.clearRect(0, 0, W, H);
	c.strokeStyle = '#1e1e1e';
	for (let x = 0; x < W; x += 20) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
	for (let y = 0; y < H; y += 20) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
	const R = SIM.robot;
	c.save();
	c.translate(W / 2 + R.x, H / 2 - R.y);
	c.rotate(-R.th);
	c.fillStyle = '#242424'; c.strokeStyle = '#00adb5'; c.lineWidth = 2;
	c.beginPath(); c.rect(-26, -20, 52, 40); c.fill(); c.stroke();
	c.beginPath(); c.moveTo(26, 0); c.lineTo(38, 0); c.stroke();
	const mv = (k) => { const v = SIM.deviceValue(P.sim.mapper[k]); return v === null ? null : v; };
	const drawMotor = (x, y, v, name) => {
		c.fillStyle = '#333'; c.fillRect(x - 6, y - 12, 12, 24);
		if (v !== null) {
			c.fillStyle = v >= 0 ? '#00adb5' : '#ff8a65';
			/* the bar is the speed the mapper would send, 0..MOTOR_SPEED_RESOLUTION */
			const hgt = SIM.motorSpeed(v) / MOTOR_SPEED_RESOLUTION * 12;
			c.fillRect(x - 6, v >= 0 ? y - hgt : y, 12, hgt);
		}
		c.fillStyle = '#888'; c.font = '9px sans-serif'; c.fillText(name, x - 7, y + 22);
	};
	drawMotor(-30, -0, mv('M1'), 'M1');
	drawMotor(30, 0, mv('M2'), 'M2');
	drawMotor(0, -26, mv('M3'), 'M3');
	const drawServo = (x, y, v, name) => {
		c.strokeStyle = '#555'; c.beginPath(); c.arc(x, y, 12, 0, Math.PI * 2); c.stroke();
		if (v !== null) {
			/* the horn follows the position the mapper would send, 0..MAX_SERVO_VALUE */
			const ang = (SIM.servoPosition(v) / MAX_SERVO_VALUE) * Math.PI - Math.PI / 2;
			c.strokeStyle = '#f0c2df'; c.lineWidth = 2.5;
			c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(ang) * 12, y + Math.sin(ang) * 12); c.stroke();
		}
		c.fillStyle = '#888'; c.font = '9px sans-serif'; c.fillText(name, x - 6, y + 24);
	};
	drawServo(-14, 30, mv('S1'), 'S1');
	drawServo(14, 30, mv('S2'), 'S2');
	c.restore();
}

function uiExport() {
	analyse();

	const guide = registrationGuide();
	const errs = ANALYSIS.findings.filter(f => f.sev === 'error');
	const warns = ANALYSIS.findings.filter(f => f.sev === 'warn');
	const blocked = errs.length > 0 || !!err || (g && g.assertMsg) || (SELFTEST.ran && SELFTEST.fail > 0) || !SELFTEST.ran;

	let h = '<h3>Export ' + esc(fileBase()) + '</h3>';
	if (!SELFTEST.ran) h += '<div class="errbox">The FAC_MATH self-test has not been run. Export is blocked until it is green - a build whose math does not agree with itself must not produce firmware.<br><button id="exTest">run the self-test now</button></div>';
	else if (SELFTEST.fail) h += '<div class="errbox">The self-test has ' + SELFTEST.fail + ' failures. Export is blocked.</div>';
	if (err) h += '<div class="errbox">code generation failed: ' + esc(err) + '</div>';
	if (g && g.assertMsg) h += '<div class="errbox">' + esc(g.assertMsg) + '</div>';
	if (errs.length) h += '<div class="errbox"><b>' + errs.length + ' error' + (errs.length > 1 ? 's' : '') + ' block export:</b><ul>' +
		errs.map(f => '<li>' + esc(f.msg) + '</li>').join('') + '</ul></div>';
	if (warns.length) h += '<div class="warnbox"><b>' + warns.length + ' warning' + (warns.length > 1 ? 's' : '') + '</b> (they do not block export):<ul>' +
		warns.slice(0, 12).map(f => '<li>' + esc(f.msg) + '</li>').join('') + (warns.length > 12 ? '<li>&hellip;</li>' : '') + '</ul></div>';

	h += '<h4>Assumed enum sizes</h4><p class="muted" style="font-size:11px">This tool cannot read your firmware tree, so it asks. Count the entries in the enum, <span class="mono">_LAST</span> excluded. The registration guide says which numbers it used, so a wrong one is visible instead of silent.</p>' +
		'<div class="row"><label style="width:330px">entries in <span class="mono">enum FAC_MIXES_ID</span> before <span class="mono">FAC_MIX_LAST</span></label>' +
		'<input type="number" id="exM" value="' + P.reg.mixCount + '" min="0" max="200" style="width:70px"></div>' +
		'<div class="row"><label style="width:330px">entries in <span class="mono">enum FAC_SPECIAL_FUNCTIONS_ID</span> before <span class="mono">_LAST</span></label>' +
		'<input type="number" id="exF" value="' + P.reg.fnCount + '" min="0" max="20" style="width:70px"></div>' +
		'<p class="muted" style="font-size:11px">Defaults are the firmware this tool was written against: 2 mixes (<span class="mono">FAC_MIX_NONE</span>, <span class="mono">FAC_MIX_SIMPLE_TANK</span>) and 11 special functions (8 &times; <span class="mono">DIRECT_LINK_TO_CHANNEL</span> + 3 &times; <span class="mono">DC_SERVO</span>).</p>';

	if (P.mode === 'function') {
		const free20 = Math.max(0, SPECIAL_FUNCITONS_NUMBER - P.reg.fnCount);
		const free10 = Math.max(0, 11 - P.reg.fnCount);
		h += '<div class="' + (free10 === 0 ? 'errbox' : 'warnbox') + '"><b>' + free20 + '</b> free ID' + (free20 === 1 ? '' : 's') +
			' before <span class="mono">FAC_SPECIAL_FUNCTION_LAST</span> overruns the framework arrays (20), and <b>' + free10 + '</b> before new IDs stop being linkable to any device at all &mdash; the five mapper rows have a hardcoded <span class="mono">max</span> of <span class="mono">200+10</span>. Two different limits with two different consequences.</div>';
	}

	h += '<h4>Files</h4><div class="row">' +
		'<button ' + (blocked ? 'disabled' : '') + ' class="primary" id="exAll">download all three</button>' +
		'<button ' + (blocked ? 'disabled' : '') + ' id="exC">' + esc(fileBase()) + '.c</button>' +
		'<button ' + (blocked ? 'disabled' : '') + ' id="exH">' + esc(fileBase()) + '.h</button>' +
		'<button id="exR">REGISTRATION_' + esc(projName()) + '.md</button>' +
		'<label><input type="checkbox" id="exJ"' + (P.embedJson ? ' checked' : '') + '> embed the project JSON in the .c (round-trip)</label>' +
		'</div>' +
		'<p class="muted" style="font-size:11px">Sources are written with CRLF line endings, to match the firmware tree. There is <b>no patch file and no diff</b>: the registration guide is textual on purpose, because the insertion points depend on what your own <span class="mono">fac_mixes.c</span> already contains.</p>' +
		'<h4>Bundle (copy all of it at once)</h4>' +
		'<pre class="code" style="max-height:280px">' + esc(g ? ('===== ' + fileBase() + '.c =====\n' + g.c + '\n\n===== ' + fileBase() + '.h =====\n' + g.h + '\n\n===== REGISTRATION_' + projName() + '.md =====\n' + guide) : guide) + '</pre>';
	modal(h);
	const t = $('#exTest'); if (t) t.onclick = () => { runSelfTest(); uiExport(); };
	$('#exM').onchange = e => { P.reg.mixCount = Number(e.target.value) | 0; refreshAll(); uiExport(); };
	$('#exF').onchange = e => { P.reg.fnCount = Number(e.target.value) | 0; refreshAll(); uiExport(); };
	$('#exJ').onchange = e => { P.embedJson = e.target.checked; uiExport(); };
	$('#exR').onclick = () => download('REGISTRATION_' + projName() + '.md', guide);
	if (!blocked) {
		$('#exC').onclick = () => download(fileBase() + '.c', g.c);
		$('#exH').onclick = () => download(fileBase() + '.h', g.h);
		$('#exAll').onclick = () => {
			download(fileBase() + '.c', g.c);
			setTimeout(() => download(fileBase() + '.h', g.h), 250);
			setTimeout(() => download('REGISTRATION_' + projName() + '.md', guide), 500);
		};
	}
}

function uiHelp() {
	modal('<h3>F.A.C. V2 mix &amp; special function editor</h3>' +
		'<p>Assemble a mix (8 inputs / 10 outputs) or a special function (1 in / 1 out) out of the closed set of integer blocks ' +
		'<span class="mono">fac_math.h</span> offers, simulate it here bit-identically to the MCU, and export the ' +
		'<span class="mono">.c</span> / <span class="mono">.h</span> pair plus a registration guide.</p>' +
		'<h4>Why this can be exact</h4>' +
		'<p>A mix is a composition of about thirty known <b>integer</b> operations, not arbitrary C. Arbitrary C cannot be simulated in a browser; ' +
		'these can &mdash; and being integer, the browser and the Cortex-M0 produce the same value, not a close one. The single rule that makes it work is ' +
		'that C division truncates toward zero, so this tool uses <span class="mono">Math.trunc</span> and never <span class="mono">Math.floor</span>. ' +
		'The Self-test tab asserts that, and about a hundred other things, on every run.</p>' +
		'<h4>The receiver chain has four stages, not two</h4>' +
		'<table class="g"><tr><th class="l">stage</th><th class="l">range</th><th class="l">who</th></tr>' +
		'<tr><td class="l">0 backend capture</td><td class="l">0 &hellip; 1000</td><td class="l">the sliders, or a gamepad</td></tr>' +
		'<tr><td class="l">1a deadzone</td><td class="l">0 &hellip; 1000</td><td class="l"><span class="mono">FAC_std_receiver_calculate_dead_zone()</span></td></tr>' +
		'<tr><td class="l">1b store clamp</td><td class="l">clamp to 1000</td><td class="l"><span class="mono">FAC_std_receiver_SET_channel()</span></td></tr>' +
		'<tr><td class="l">2 mix input</td><td class="l">-1000 &hellip; +1000</td><td class="l"><span class="mono">FAC_math_from_range(ch, 0, 1000)</span></td></tr></table>' +
		'<p>The channel domain is <b>0 &hellip; 1000 inclusive &mdash; 1001 values</b>, so it has an exact centre: 500 normalises to exactly 0, and ' +
		'<span class="mono">mix_input = 2&times;ch &minus; 1000</span> holds across the whole chain with no rounding. The stages are still modelled separately because ' +
		'they are separate functions in the firmware with separate domains; collapsing them would either double-apply the deadzone or invent travel the hardware ' +
		'does not have. A channel value of <b>0 is not "no signal"</b>, it is full negative travel.</p>' +
		'<p>At the device end the mapper converts back: a servo gets <span class="mono">FAC_math_to_range(v, 0, MAX_SERVO_VALUE)</span> &rarr; ' +
		'<b>0 &hellip; 999</b> (999 is the divisor of the pulse formula, so the centre lands on 499), a motor gets <span class="mono">abs(v)</span> &rarr; ' +
		'<b>0 &hellip; 1000</b> with the sign carried as direction, and full stick is a true 100 % duty.</p>' +
		'<h4>Cost model</h4>' +
		'<p>Cortex-M0 at 48 MHz: no FPU, <b>no hardware divider</b>, no long multiply. Even <span class="mono">/1000</span> is a call to ' +
		'<span class="mono">__aeabi_idiv</span>. Every block shows its division count and the readout at the bottom right keeps the running total. ' +
		'<span class="mono">expo</span> costs 3, <span class="mono">sin</span>/<span class="mono">cos</span> 4, <span class="mono">atan2</span> 6; ' +
		'<span class="mono">sqrt</span> pays no division but always walks 16 steps.</p>' +
		'<h4>Group 4 and why there is no shift block</h4>' +
		'<p>Group 4 is plain C: unsaturated sums, a raw absolute value, multiply and divide by a literal, comparisons and a ternary. It exists because ' +
		'<span class="mono">fac_simple_tank_mix.c</span> deliberately lets its sums reach twice full scale before halving them, and no group 1 primitive can express that. ' +
		'There is no <span class="mono">&gt;&gt;</span> block on purpose: <span class="mono">-3 &gt;&gt; 1</span> is <span class="mono">-2</span> while ' +
		'<span class="mono">-3 / 2</span> is <span class="mono">-1</span>, so a shift is not a division and swapping them changes behaviour around zero. ' +
		'Every group 4 result must be <i>proven</i> to fit <span class="mono">int32_t</span> by the interval analysis, or it is an error &mdash; the group has no clamp and no guard.</p>' +
		'<h4>Keyboard</h4>' +
		'<table class="g"><tr><td class="l">double click a palette block</td><td class="l">add it at the centre</td></tr>' +
		'<tr><td class="l">drag port &rarr; port</td><td class="l">wire (drag from a connected input to detach)</td></tr>' +
		'<tr><td class="l">click a wire</td><td class="l">delete it</td></tr>' +
		'<tr><td class="l">Del / Backspace</td><td class="l">delete the selection</td></tr>' +
		'<tr><td class="l">Ctrl+C / Ctrl+V</td><td class="l">copy and paste a subgraph</td></tr>' +
		'<tr><td class="l">Ctrl+Z / Ctrl+Y</td><td class="l">undo / redo</td></tr>' +
		'<tr><td class="l">F</td><td class="l">frame all</td></tr>' +
		'<tr><td class="l">space / middle / alt drag</td><td class="l">pan &middot; wheel zooms &middot; ctrl-drag disables the grid snap</td></tr>' +
		'<tr><td class="l">group field in the inspector</td><td class="l">name a group, then use the chips at the top left to collapse it behind one box. Purely visual: the graph, the analysis and the generated code are identical either way</td></tr></table>' +
		'<h4>What this tool will never do</h4>' +
		'<p>Emit a <span class="mono">float</span>, a device write, a settings write, a blocking call, a new setting code, or a patch to your firmware. ' +
		'It writes two files and tells you, in order, what to add by hand.</p>');
}

/* ------------------------------------------------------------- clipboard */
let clipboard = null;
function copySel() {
	const ids = new Set(selection);
	clipboard = {
		nodes: P.nodes.filter(n => ids.has(n.id)).map(n => JSON.parse(JSON.stringify(n))),
		wires: P.wires.filter(w => ids.has(w.from) && ids.has(w.to)).map(w => JSON.parse(JSON.stringify(w)))
	};
}
function pasteSel() {
	if (!clipboard || !clipboard.nodes.length) return;
	pushUndo();
	const map = {};
	const fresh = clipboard.nodes.map(n => {
		const c = JSON.parse(JSON.stringify(n));
		c.id = newId(); map[n.id] = c.id; c.x += 30; c.y += 30;
		return c;
	});
	/* indices are positional: a pasted input/output must not silently collide */
	fresh.forEach(c => {
		if (c.t === 'mix_input' || c.t === 'mix_output') {
			const lim = c.t === 'mix_input' ? MIXES_MAX_INPUTS_NUMBER : MIXES_MAX_OUTPUTS_NUMBER;
			const used = P.nodes.concat(fresh).filter(o => o.t === c.t && o.id !== c.id).map(o => o.p.idx);
			for (let i = 0; i < lim; i++) if (used.indexOf(i) < 0) { c.p.idx = i; break; }
		}
	});
	P.nodes = P.nodes.concat(fresh);
	clipboard.wires.forEach(w => P.wires.push({ from: map[w.from], to: map[w.to], port: w.port }));
	selection = new Set(fresh.map(n => n.id));
	refreshAll();
}

/* --------------------------------------------------------------- autosave */
const AUTOSAVE_KEY = 'facmix.autosave.v1';
let autosaveTimer = null;
function autosave() {
	if (autosaveTimer) clearTimeout(autosaveTimer);
	autosaveTimer = setTimeout(() => {
		try { localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({ t: Date.now(), p: projectForSave() })); } catch (e) { }
	}, 700);
}

/* -------------------------------------------------------------- keyboard */
const keyState = { space: false, ctrl: false };
function initKeys() {
	window.addEventListener('keydown', e => {
		const tag = (e.target.tagName || '').toLowerCase();
		if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
		keyState.ctrl = e.ctrlKey || e.metaKey;
		if (e.code === 'Space') { keyState.space = true; e.preventDefault(); }
		if (e.key === 'Delete' || e.key === 'Backspace') { if (selection.size) { pushUndo(); removeNodes(Array.from(selection)); selection = new Set(); refreshAll(); } e.preventDefault(); }
		if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { doUndo(); e.preventDefault(); }
		if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) { doRedo(); e.preventDefault(); }
		if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') { copySel(); e.preventDefault(); }
		if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') { pasteSel(); e.preventDefault(); }
		if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') { selection = new Set(P.nodes.map(n => n.id)); refreshAll(); e.preventDefault(); }
		if (e.key === 'f' || e.key === 'F') frameAll();
	});
	window.addEventListener('keyup', e => { if (e.code === 'Space') keyState.space = false; keyState.ctrl = e.ctrlKey || e.metaKey; });
}

/* ------------------------------------------------------------------ tabs */
function initTabs() {
	$$('#tabs .tab').forEach(t => t.onclick = () => {
		$$('#tabs .tab').forEach(x => x.classList.toggle('on', x === t));
		$$('.tabPanel').forEach(p => p.classList.add('hidden'));
		$('#p-' + t.dataset.p).classList.remove('hidden');
		const f = { sim: uiSim, scope: uiScope, robot: uiRobot, sensors: uiSensors, pad: uiPad, code: uiCode, reg: uiReg, test: uiTest }[t.dataset.p];
		if (f) f();
	});
	let big = true;
	$('#btBottomToggle').onclick = () => {
		big = !big;
		$('#bottom').style.height = big ? '262px' : '26px';
		$('#btBottomToggle').innerHTML = big ? '&#9660;' : '&#9650;';
	};
}

/* --------------------------------------------------------------- toolbar */
function initToolbar() {
	$('#uiMode').onchange = e => {
		if (P.nodes.length && !confirm('Switching mode starts a new empty graph. Continue?')) { e.target.value = P.mode; return; }
		P = blankProject(e.target.value);
		syncToolbar(); uiPalette(); SIM.reset(); refreshAll(); uiSim();
	};
	$('#uiTitle').onchange = e => { P.title = e.target.value; refreshAll(); };
	$('#uiAuthor').onchange = e => { P.author = e.target.value; refreshAll(); };
	$('#uiInstances').onchange = e => {
		P.instances = Math.max(1, Math.min(9, Number(e.target.value) | 0));
		e.target.value = P.instances; SIM.reset(); refreshAll(); uiSim();
	};
	$('#btNew').onclick = () => {
		if (P.nodes.length && !confirm('Discard the current graph?')) return;
		P = blankProject(P.mode); syncToolbar(); SIM.reset(); refreshAll(); uiSim();
	};
	$('#btSave').onclick = () => download(projName() + '.facmix.json', JSON.stringify(projectForSave(), null, '\t'));
	$('#btOpen').onclick = () => $('#fileIn').click();
	$('#fileIn').onchange = e => {
		const f = e.target.files[0]; if (!f) return;
		const r = new FileReader();
		r.onload = () => {
			try {
				const txt = String(r.result);
				loadProject(/\.c$/i.test(f.name) ? importFromC(txt) : JSON.parse(txt));
				syncToolbar(); uiPalette(); refreshAll(); uiSim(); frameAll();
			} catch (err) { alert('could not open this file:\n' + err.message); }
		};
		r.readAsText(f);
		e.target.value = '';
	};
	const ps = $('#uiPreset');
	PRESET_LIST.forEach(p => { const o = document.createElement('option'); o.value = p[0]; o.textContent = p[1]; ps.appendChild(o); });
	ps.onchange = e => {
		const k = e.target.value; e.target.value = '';
		if (!k || !PRESETS[k]) return;
		if (P.nodes.length && !confirm('Replace the current graph with the "' + k.replace(/_/g, ' ') + '" preset?')) return;
		loadProject(PRESETS[k]());
		syncToolbar(); uiPalette(); refreshAll(); uiSim(); frameAll();
	};
	$('#btUndo').onclick = doUndo;
	$('#btRedo').onclick = doRedo;
	$('#btFrame').onclick = frameAll;
	$('#btExport').onclick = uiExport;
	$('#btSelfTest').onclick = () => { runSelfTest(); $$('#tabs .tab').forEach(x => { if (x.dataset.p === 'test') x.click(); }); };
	$('#btHelp').onclick = uiHelp;
	$('#palSearch').oninput = uiPalette;
}
function syncToolbar() {
	$('#uiMode').value = P.mode;
	$('#uiTitle').value = P.title;
	$('#uiAuthor').value = P.author || '';
	$('#uiInstances').value = P.instances;
	$('#lblInst').classList.toggle('hidden', P.mode !== 'function');
	$('#uiInstances').classList.toggle('hidden', P.mode !== 'function');
}

/* ------------------------------------------------------------------ loop */
let lastTs = 0;
function loop(ts) {
	requestAnimationFrame(loop);
	PAD.poll();
	const dt = lastTs ? Math.min(60, ts - lastTs) : 0;
	lastTs = ts;
	if (SIM.stepOnce) { SIM.stepOnce = false; SIM.step(); }
	else if (SIM.running) {
		const n = Math.min(2000, Math.max(0, Math.round(dt * (Number(P.sim.speed) || 1))));
		for (let i = 0; i < n; i++) SIM.step();
	}
	refreshLive();
	uiSimLive(); uiSensorsLive(); uiPadLive();
	drawScope(); drawRobot();
}

/* ------------------------------------------------------------------ boot */
function boot() {
	P = blankProject('mix');
	PAD.init();
	initCanvas(); initKeys(); initTabs(); initToolbar();
	let restored = false;
	try {
		const raw = localStorage.getItem(AUTOSAVE_KEY);
		if (raw) {
			const o = JSON.parse(raw);
			if (o && o.p && o.p.nodes && o.p.nodes.length &&
				confirm('Restore the last session (' + o.p.nodes.length + ' blocks, saved ' + new Date(o.t).toLocaleString() + ')?')) {
				loadProject(o.p); restored = true;
			}
		}
	} catch (e) { }
	if (!restored) loadProject(PRESETS.simple_tank());
	syncToolbar(); uiPalette(); refreshAll(); uiSim();
	runSelfTest();
	frameAll();
	requestAnimationFrame(loop);
}
boot();
</script>
